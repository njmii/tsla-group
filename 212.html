<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Two1two — Agent Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f7f8fa;color:#111;min-height:100vh}
.container{max-width:680px;margin:0 auto;padding:0 0 80px}

/* PIN */
#pinOverlay{position:fixed;inset:0;background:#f7f8fa;z-index:999;display:flex;align-items:center;justify-content:center}
.pin-box{background:white;border-radius:24px;padding:36px 28px;width:320px;max-width:90vw;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.1)}
.pin-logo-img{width:72px;height:auto;margin-bottom:14px}
.pin-title{font-weight:900;font-size:1.4rem;margin-bottom:5px;color:#111}
.pin-sub{color:#888;font-size:.82rem;margin-bottom:24px}
.pin-input{width:100%;border:2px solid #eee;border-radius:14px;padding:14px;font-size:1.6rem;text-align:center;letter-spacing:.4em;outline:none;font-weight:700;background:#f7f8fa;color:#111;transition:.15s;-webkit-text-security:disc}
.pin-input:focus{border-color:#ff7a00}
.pin-err{color:#e53935;font-size:.8rem;margin-top:8px;min-height:18px;font-weight:700}
.pin-btn{margin-top:16px;width:100%;background:#ff7a00;color:#fff;border:none;border-radius:14px;padding:14px;font-size:1rem;font-weight:800;cursor:pointer}
.pin-btn:active{opacity:.85}

/* App hidden until unlocked */
#app{display:none}

/* Top bar */
.top-bar{background:#ff7a00;padding:13px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(255,122,0,.3)}
.top-logo{width:34px;height:34px;object-fit:contain;filter:brightness(0) invert(1)}
.top-brand{font-weight:900;font-size:1.1rem;color:#fff;flex:1}
.month-sel{background:rgba(0,0,0,.2);color:#fff;border:none;border-radius:10px;padding:7px 10px;font-size:.82rem;font-weight:700;cursor:pointer;outline:none;-webkit-appearance:none;appearance:none}
.month-sel option{background:#fff;color:#111}

/* Sub bar */
.sub-bar{background:white;padding:9px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.pu-wrap{display:flex;border-radius:10px;overflow:hidden;border:2px solid #ff7a00}
.pu-btn{border:none;background:transparent;color:#ff7a00;padding:5px 18px;font-size:.82rem;font-weight:900;cursor:pointer;transition:.12s}
.pu-btn.on{background:#ff7a00;color:#fff}
.upd-lbl{font-size:.7rem;color:#ff7a00;font-weight:700}

/* Content padding */
.content{padding:13px 13px 0}

/* Cards */
.card{background:white;border-radius:18px;overflow:hidden;margin-bottom:12px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.card-hdr{padding:11px 16px;font-size:.75rem;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:#fff}
.card-body{padding:14px 16px 16px}
.hdr-orange{background:#e87c25}
.hdr-red{background:#c0392b}
.hdr-purple{background:#6b5bef}
.hdr-teal{background:#028090}
.hdr-violet{background:#7b1fa2}
.hdr-slate{background:#455a64}
.hdr-dark{background:#555}

/* Startup scheme */
.su-hdr{background:#7b1fa2;padding:11px 16px;font-size:.75rem;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:#fff;border-radius:18px 18px 0 0}
.su-body{padding:14px 16px 16px}
.su-card{background:white;border-radius:18px;overflow:hidden;margin-bottom:12px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.su-scheme-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.su-scheme-name{font-size:1rem;font-weight:900;color:#7b1fa2}
.su-status-pill{font-size:.65rem;font-weight:800;border-radius:20px;padding:3px 10px}
.su-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.su-stat{background:#f7f8fa;border-radius:12px;padding:11px 13px}
.su-stat-lbl{font-size:.58rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#999;margin-bottom:3px}
.su-stat-val{font-size:1.1rem;font-weight:900;letter-spacing:-.02em;color:#111}
.su-stat-sub{font-size:.63rem;color:#aaa;margin-top:2px;font-weight:700}
.su-prog-wrap{background:#e9d5ff;border-radius:99px;height:8px;overflow:hidden;margin:6px 0 3px}
.su-prog-bar{height:100%;border-radius:99px}
.su-prog-row{display:flex;justify-content:space-between;font-size:.63rem;color:#999;font-weight:700;margin-bottom:10px}
.su-divider{border:none;border-top:1px solid #f0f0f0;margin:12px 0}
.su-month-hdr{font-size:.63rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#7b1fa2;margin-bottom:8px}
.su-month-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.su-result-pill{font-size:.68rem;font-weight:800;border-radius:8px;padding:3px 8px;display:inline-block}
.su-badge{font-size:.57rem;font-weight:800;border-radius:6px;padding:2px 6px;background:#f3e8ff;color:#7b1fa2;display:inline-block;margin-top:3px}

/* Two-col grid */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.g2 .card{margin-bottom:0}

/* Stat display */
.st-lbl{font-size:.63rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#999;margin-bottom:3px}
.st-val{font-size:1.45rem;font-weight:900;letter-spacing:-.02em}
.st-sub{font-size:.7rem;color:#999;margin-top:2px;font-weight:700}

/* Section header */
.sec-h{font-size:.63rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#aaa;margin:14px 0 9px;padding-left:1px}

/* Agent grid */
.ag-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ag-card{background:white;border-radius:16px;padding:14px;cursor:pointer;border:2px solid transparent;transition:.15s;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.ag-card:hover,.ag-card:active{border-color:#ff7a00}
.ag-name{font-weight:900;font-size:.88rem;margin-bottom:2px}
.ag-code{font-size:.67rem;color:#aaa;margin-bottom:7px}
.prog-wrap{background:#eee;border-radius:99px;height:7px;overflow:hidden;margin:6px 0 4px}
.prog-bar{height:100%;border-radius:99px}

/* Band chip */
.band{font-size:.64rem;font-weight:800;border-radius:8px;padding:3px 8px;display:inline-block}

/* Agent detail header */
.ag-hdr-box{background:white;border-radius:18px;padding:15px;margin-bottom:12px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.ag-av{width:46px;height:46px;border-radius:13px;background:#ff7a00;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:900;color:#fff;flex-shrink:0}
.back-btn{display:flex;align-items:center;gap:6px;background:#f0f0f0;border:none;border-radius:12px;padding:9px 15px;color:#ff7a00;font-size:.82rem;font-weight:800;cursor:pointer;margin-bottom:12px}

/* Tabs */
.tab-row{display:flex;gap:4px;background:#f0f0f0;border-radius:14px;padding:4px;margin-bottom:13px}
.tab-btn{flex:1;border:none;background:transparent;border-radius:11px;padding:8px 0;font-size:.74rem;font-weight:800;cursor:pointer;color:#999;transition:.12s}
.tab-btn.on{background:#ff7a00;color:#fff}

/* KPI rows */
.kpi-row{display:flex;justify-content:space-between;align-items:center;font-size:.77rem;padding:7px 0;border-bottom:1px solid #f2f2f2;color:#444}
.kpi-row:last-child{border-bottom:none}
.kpi-pts{font-weight:900;font-size:.85rem}
.kpi-sub{padding-left:10px;color:#bbb;font-size:.71rem}

/* Progress bar */
.pct-row{display:flex;justify-content:space-between;font-size:.71rem;color:#999;font-weight:700;margin-bottom:8px}

/* Manual payment items (MTD list) */
.mp-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:12px;background:#f7f8fa;margin-bottom:6px}
.mp-info{flex:1;min-width:0}
.mp-nm{font-weight:700;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-mt{font-size:.66rem;color:#aaa;margin-top:1px}
.mp-badge{font-size:.62rem;font-weight:800;border-radius:7px;padding:2px 7px;flex-shrink:0}
.mp-amt{font-size:.73rem;font-weight:800;color:#555;flex-shrink:0;text-align:right}

/* Shortfall chip */
.sf-chip{display:inline-block;padding:6px 13px;border-radius:12px;font-size:.79rem;font-weight:800;margin-top:8px}

/* Big number */
.big-num{font-size:2.2rem;font-weight:900;letter-spacing:-.04em;line-height:1}
.big-sub{font-size:.72rem;color:#999;font-weight:700;margin-top:2px}

/* Metric box */
.mbox{background:#f7f8fa;border-radius:12px;padding:12px 14px}
.mbox-lbl{font-size:.63rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#999;margin-bottom:4px}
.mbox-val{font-size:1.55rem;font-weight:900;letter-spacing:-.03em}

/* Chips row */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:13px}
.chip{background:#f0f0f0;border-radius:10px;padding:5px 10px;font-size:.7rem;font-weight:700;color:#aaa}
.chip span{font-weight:900;color:#111}

/* Audit table */
.audit-wrap{overflow-x:auto;border-radius:12px;border:1px solid #eee}
table.audit{width:100%;border-collapse:collapse;font-size:.73rem}
table.audit th{padding:9px 9px;text-align:left;font-size:.61rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#aaa;border-bottom:1px solid #eee;white-space:nowrap;background:#f7f8fa}
table.audit td{padding:8px 9px;border-bottom:1px solid #f5f5f5;vertical-align:middle}
table.audit tr:last-child td{border-bottom:none}
.cls-chip{font-size:.62rem;font-weight:800;border-radius:6px;padding:2px 6px;white-space:nowrap}
.pool-chip{font-size:.58rem;font-weight:800;border-radius:5px;padding:1px 5px;white-space:nowrap}

/* Footer */
.footer{background:#ff7a00;text-align:center;padding:16px;margin-top:20px;font-size:.7rem;color:#fff;font-weight:700;letter-spacing:.02em}

.empty-msg{text-align:center;padding:22px;color:#bbb;font-size:.84rem}
.loading{text-align:center;padding:40px;color:#bbb}

/* ── PR13 audit tab (agent-report style, light) */
.ar-sum-box{border-radius:15px;padding:13px 15px;margin-bottom:11px}
.ar-sum-ttl{font-size:.63rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:9px;cursor:pointer;user-select:none;display:flex;justify-content:space-between;align-items:center}
.ar-sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.ar-sum-big{border-radius:11px;padding:11px;text-align:center;grid-column:1/-1}
.ar-sum-big-lbl{font-size:.6rem;font-weight:800;opacity:.82;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.ar-sum-big-val{font-size:1.85rem;font-weight:900;letter-spacing:-.03em;line-height:1;color:#fff}
.ar-sum-it{background:#f7f8fa;border-radius:9px;padding:9px 11px}
.ar-sum-lbl{font-size:.6rem;color:#999;margin-bottom:2px}
.ar-sum-val{font-weight:800;font-size:.82rem}
.pool-tab-row{display:flex;gap:6px;margin-bottom:10px}
.pool-tab{border:none;border-radius:11px;padding:7px 14px;font-size:.75rem;font-weight:800;cursor:pointer;color:#999;background:#f0f0f0;transition:.12s}
.pool-tab-pr.on{background:#0a9b43;color:#fff}
.pool-tab-ce.on{background:#1a73e8;color:#fff}
.ar-filter-bar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.ar-search{flex:1;min-width:120px;border:2px solid #eee;border-radius:11px;padding:7px 10px;font-size:.77rem;outline:none;font-family:inherit;color:#111;background:white}
.ar-search:focus{border-color:#ff7a00}
.ar-sel{border:2px solid #eee;border-radius:11px;padding:6px 8px;font-size:.7rem;font-weight:700;outline:none;background:white;color:#555;cursor:pointer}
.ar-sel:focus{border-color:#ff7a00}
.ar-tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid #eee;margin-bottom:12px}
table.ar-tbl{width:100%;border-collapse:collapse;font-size:.71rem}
table.ar-tbl th{background:#f7f8fa;font-weight:800;font-size:.6rem;text-transform:uppercase;letter-spacing:.04em;color:#aaa;padding:8px 9px;text-align:left;white-space:nowrap;border-bottom:1px solid #eee}
table.ar-tbl td{padding:7px 9px;border-bottom:1px solid #f5f5f5;vertical-align:top}
table.ar-tbl tr:last-child td{border-bottom:none}
table.ar-tbl tr.dim-r td{opacity:.38}
.ar-cls{font-size:.61rem;font-weight:800;border-radius:7px;padding:2px 6px;white-space:nowrap}
.ar-100{background:#e6f9ee;color:#0a9b43}
.ar-0{background:#ffebee;color:#e53935}
.ar-excl{background:#f0f0f0;color:#aaa}
.ar-na{background:#f5f5f5;color:#ccc}
.ar-st{font-size:.61rem;font-weight:700;border-radius:6px;padding:2px 6px;display:inline-block;white-space:nowrap}
.ar-if{background:#e6f9ee;color:#0a9b43}
.ar-lp{background:#ffebee;color:#e53935}
.ar-cs{background:#f0f0f0;color:#aaa}
table.ar-tbl td.r{text-align:right;font-weight:700}
.zcb{width:13px;height:13px;cursor:pointer;accent-color:#0a9b43;margin-right:2px;vertical-align:middle}
.proj-bar{background:rgba(10,155,67,.06);border:2px dashed rgba(10,155,67,.3);border-radius:12px;padding:8px 13px;margin-bottom:10px;font-size:.77rem;color:#0a9b43;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.whatif-hint{font-size:.72rem;background:rgba(10,155,67,.05);border-radius:9px;padding:7px 11px;margin-top:7px;line-height:1.5;color:#555}
/* ── MP tab (agent-report style, light) */
.sp-cl-row{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:12px;margin-bottom:6px;border-left:3px solid transparent}
.sp-cl-info{flex:1;min-width:0}
.sp-cl-name{font-weight:700;font-size:.82rem}
.sp-cl-meta{font-size:.65rem;color:#aaa;margin-top:2px}
.sp-cl-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.sp-cl-right{text-align:right;flex-shrink:0}
.sp-contrib2{font-weight:800;font-size:.77rem;color:#444}
.sp-tag2{font-size:.6rem;font-weight:800;border-radius:7px;padding:2px 6px}
/* Activity tab */
.act-link-btn{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#1565c0,#1e88e5);color:white;border:none;border-radius:14px;padding:13px 18px;font-size:.85rem;font-weight:800;cursor:pointer;width:100%;margin-bottom:14px;font-family:inherit;text-decoration:none;justify-content:center}
.act-link-btn:active{opacity:.85}
.act-date-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px}
.act-date-nav-btn{background:white;border:2px solid #eee;border-radius:12px;width:38px;height:38px;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.act-date-nav-btn:hover{border-color:#ff7a00;color:#ff7a00}
.act-date-nav-btn:disabled{opacity:.3;cursor:default}
.act-date-label{font-weight:800;font-size:.97rem;min-width:120px;text-align:center;line-height:1.3}
.act-date-sub{font-size:.72rem;color:#aaa;font-weight:600;text-align:center}
.act-metrics-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.act-metric-box{background:#f7f8fa;border:2px solid #eee;border-radius:18px;padding:16px;text-align:center;transition:.15s}
.act-metric-box:focus-within{border-color:#ff7a00;background:white}
.act-metric-lbl{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em;margin-bottom:10px}
.act-metric-lbl-present{color:#1a73e8}
.act-metric-lbl-close{color:#0a9b43}
.act-metric-input{width:100%;border:none;background:transparent;text-align:center;font-size:2.6rem;font-weight:900;color:#111;outline:none;line-height:1;font-family:inherit}
.act-metric-input::placeholder{color:#e0e0e0}
.act-metric-sub{font-size:.7rem;color:#aaa;margin-top:5px}
.act-submit-btn2{width:100%;background:#ff7a00;color:white;border:none;border-radius:16px;padding:15px;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s}
.act-submit-btn2:active{transform:scale(.98)}
.act-submit-btn2:disabled{opacity:.5;cursor:default}
.act-stab-row{display:flex;gap:6px;padding:12px 16px;border-bottom:1px solid #f0f0f0}
.act-stab{padding:6px 16px;border:none;border-radius:10px;font-size:.78rem;font-weight:800;cursor:pointer;font-family:inherit;background:#f0f0f0;color:#888;transition:.15s}
.act-stab.active{background:#111;color:white}
.act-totals-strip{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 0;margin-bottom:10px}
.act-total-box{background:#f7f8fa;border-radius:14px;padding:14px 16px;text-align:center}
.act-total-lbl{font-size:.67rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.act-total-lbl.present{color:#1a73e8}
.act-total-lbl.close{color:#0a9b43}
.act-total-val{font-size:2.2rem;font-weight:900}
.act-total-val.present{color:#1a73e8}
.act-total-val.close{color:#0a9b43}
.act-amod-derived{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.act-amod-d-box{background:#f7f8fa;border-radius:14px;padding:12px 14px}
.act-amod-d-lbl{font-size:.67rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#aaa;margin-bottom:5px}
.act-amod-d-val{font-size:1.4rem;font-weight:900;color:#111}
.act-amod-progress{background:#f7f8fa;border-radius:14px;padding:12px 14px;margin-bottom:12px}
.act-amod-prog-lbl{font-size:.67rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#aaa;margin-bottom:8px}
.act-amod-prog-bar-wrap{background:#e8e8e8;border-radius:8px;height:8px;overflow:hidden;margin-bottom:6px}
.act-amod-prog-bar{height:8px;border-radius:8px;background:#ff7a00;transition:width .4s}
.act-amod-prog-note{font-size:.75rem;color:#888;font-weight:600}
.act-amod-alert{background:rgba(229,57,53,.07);border:1.5px solid rgba(229,57,53,.25);border-radius:14px;padding:12px 14px;display:flex;align-items:flex-start;gap:10px;margin-top:10px}
.act-amod-alert-title{font-weight:800;font-size:.88rem;color:#c62828;margin-bottom:2px}
.act-amod-alert-sub{font-size:.76rem;color:#888;line-height:1.4}
.act-amod-good{background:rgba(10,155,67,.07);border:1.5px solid rgba(10,155,67,.25);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin-top:10px}
.act-amod-good-text{font-weight:700;font-size:.86rem;color:#0a6b2e}
.act-mo-table{width:100%;border-collapse:collapse}
.act-mo-table th{padding:8px 16px;font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:#bbb;text-align:left;border-bottom:2px solid #f0f0f0}
.act-mo-table th.num{text-align:center}
.act-mo-table td{padding:12px 16px;border-bottom:1px solid #f7f8fa;vertical-align:middle}
.act-mo-table td.num{text-align:center;font-variant-numeric:tabular-nums}
.act-mo-table tr:last-child td{border-bottom:none}
.act-mo-table tr{cursor:pointer}
.act-mo-table tr:hover td{background:#fafafa}
.act-hist-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #f7f8fa;cursor:pointer}
.act-hist-row:last-child{border-bottom:none}
.act-hist-row:hover{background:#fafafa}
.act-hist-date{font-size:.82rem;font-weight:700;color:#555}
.act-hist-nums{display:flex;gap:8px}
.act-num-chip{font-size:.75rem;font-weight:800;padding:3px 10px;border-radius:8px}
.act-present{background:rgba(26,115,232,.12);color:#1a73e8}
.act-close{background:rgba(39,174,96,.12);color:#27ae60}

/* ── Alert badge chips on home cards ── */
.alert-chip{font-size:.56rem;font-weight:800;border-radius:6px;padding:2px 6px;display:inline-block;margin-top:4px;margin-right:3px}

</style>
</head>
<body>

<!-- PIN -->
<div id="pinOverlay">
  <div class="pin-box">
    <img src="assets/tslalogo.png" class="pin-logo-img" alt="TSLA">
    <div class="pin-title">Two1two</div>
    <div class="pin-sub">Agent Dashboard — Masukkan PIN</div>
    <input id="pinInput" class="pin-input" type="tel" maxlength="4" placeholder="••••"
      oninput="if(this.value.replace(/\D/g,'').length===4){this.value=this.value.replace(/\D/g,'');submitPin()}"
      autocomplete="off" inputmode="numeric">
    <div id="pinErr" class="pin-err"></div>
    <button class="pin-btn" onclick="submitPin()">Masuk</button>
  </div>
</div>

<!-- App -->
<div id="app">
  <div class="top-bar">
    <img src="assets/tslalogo.png" class="top-logo" alt="TSLA">

<script>
/* ── PIN ─────────────────────────────── */
const PIN = '1111';
function submitPin() {
  const v = document.getElementById('pinInput').value;
  if (v === PIN) {
    sessionStorage.setItem('212_ok','1');
    document.getElementById('pinOverlay').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initApp();
  } else {
    document.getElementById('pinErr').textContent = 'PIN salah. Cuba lagi.';
    document.getElementById('pinInput').value = '';
  }
}

/* ── Config ──────────────────────────── */
const GROUPS = {
  'A11668': { name: 'TSLA Unit',  logo: 'assets/tslalogo.png',       members: ['A11668','A13290','A14252','A12322'] },
  'A15781': { name: 'HTP',        logo: 'assets/logo-htp.png',        members: ['A15781','A16553'] },
  'A15756': { name: 'SSG',        logo: 'assets/logo-ssg.png',        members: ['A15756','A14252','A15475'] },
  'A14252': { name: 'ResaRose',   logo: 'assets/logo-reezora.png',    members: ['A14252','A15475'] },
};
// Agents without their own group → show introducer's group when U is pressed
const AGENT_TO_GROUP = {
  'A16553': 'A15781', // Adam → Fauzan → HTP
  'A15475': 'A14252', // Muaz → Roza → ResaRose
};
function getGroupForAgent(code) {
  if (GROUPS[code])                    return { leaderCode: code,         ...GROUPS[code] };
  const ldr = AGENT_TO_GROUP[code];
  if (ldr && GROUPS[ldr])              return { leaderCode: ldr,          ...GROUPS[ldr] };
  return null;
}
const MTD_TARGET = 10000;
const X13 = new Set(['FWD Life First','FWD Protect First','FWD Income First']);
const FX12 = new Set(['AN443318','AN457372']);
const EXCLUDE_AGENTS = new Set(['A15741']);
const NO_COMMISSION  = new Set(['A11668']);
const COMM_RATE = 0.32 / 12;
const ACTIVITY_CODE_MAP = { 'A14252': 'TSLA_ROZA' };
const STARTUP_AGENTS = new Set(['A15475','A15756','A15781','A16553']);
function actCode(prCode) { return ACTIVITY_CODE_MAP[prCode] || prCode; }

/* ── State ───────────────────────────── */
let DATA = null, STARTUP_DATA = null, CUR = null, PU = 'P', VY, VM;
let _PR_POOL='PR13', _PR_ROWS=[], _PR_R13=null, _PR_CE=null;
let _MP_CLIENTS=[], _MP_FILTER='all';
let _ACT_UNSUB=null, _FB_DB=null, _ACT_ALL_DATA={}, _ACT_VIEW_DATE=null, _ACT_TAB_ACT='daily', _ACT_LAST_PR_CODE=null;

/* ── Date init ───────────────────────── */
function initDate() {
  const t = new Date();
  VY = t.getFullYear(); VM = t.getMonth();
}
function vKey() { return VY * 12 + VM; }
function vLabel() {
  return new Date(VY, VM, 1).toLocaleString('en-MY',{month:'short',year:'numeric'});
}
function buildMonths() {
  const sel = document.getElementById('monthSel');
  const t = new Date(); t.setDate(1);
  for (let i = 0; i < 12; i++) {
    const y = t.getFullYear(), m = t.getMonth();
    const o = document.createElement('option');
    o.value = `${y}-${m}`;
    o.textContent = new Date(y,m,1).toLocaleString('en-MY',{month:'short',year:'numeric'});
    if (y===VY && m===VM) o.selected = true;
    sel.appendChild(o);
    t.setMonth(t.getMonth()-1);
  }
}
function onMonthChange() {
  const [y,m] = document.getElementById('monthSel').value.split('-').map(Number);
  VY=y; VM=m; refresh();
}
function setUpdLbl() {
  const t=new Date();
  const d=String(t.getDate()).padStart(2,'0'),mo=String(t.getMonth()+1).padStart(2,'0');
  document.getElementById('updLbl').textContent=`last updated ${d}/${mo}/${t.getFullYear()}`;
}

/* ── P/U ─────────────────────────────── */
function setPU(v) {
  PU=v;
  document.getElementById('puP').classList.toggle('on',v==='P');
  document.getElementById('puU').classList.toggle('on',v==='U');
  refresh();
}
function refresh() { CUR ? renderDash(CUR) : renderHome(); }

/* ── Clients for agent ───────────────── */
function agClients(code) {
  if (!DATA) return [];
  if (PU === 'U') {
    const grp = getGroupForAgent(code);
    if (grp) {
      const s = new Set(grp.members);
      return DATA.agents.filter(a=>s.has(a.code)).flatMap(a=>a.clients||[]);
    }
  }
  const a = DATA.agents.find(a=>a.code===code);
  return a ? (a.clients||[]) : [];
}

/* ── ACE helpers ─────────────────────── */
function ace(c) {
  const cert=(c.certNo||'').replace(/^FWD\//,'');
  if (!FX12.has(cert) && X13.has(c.plan)) {
    const d=new Date(c.issueDate||'');
    if (!isNaN(d)&&d>=new Date('2024-07-01')&&d<=new Date('2024-11-30')&&c.contribution>=200)
      return Math.round(c.contribution*13*100)/100;
  }
  return c.ace||Math.round(c.contribution*12*100)/100;
}
function moPaid(c) {
  if (!c.issueDate||!c.statusUpdatedDate) return 0;
  const a=new Date(c.issueDate),b=new Date(c.statusUpdatedDate);
  return (b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
}
function projLast() { return new Date(VY,VM+1,0); }
function pitStatus(c) {
  if (!c.statusUpdatedDate) return c.status;
  const u=new Date(c.statusUpdatedDate);
  if (c.status==='Contract Surrendered'&&u>projLast()) return 'In Force';
  if (c.status==='Lapsed') {
    const uk=u.getFullYear()*12+u.getMonth();
    if (uk>vKey()&&moPaid(c)>=13) return 'In Force';
  }
  return c.status;
}

/* ── Classification ──────────────────── */
function clsPR13(c) {
  if (!c.issueDate) return {cls:'na'};
  const ik=new Date(c.issueDate).getFullYear()*12+new Date(c.issueDate).getMonth();
  const b=vKey(),ws=b-24,we=b-12;
  if (ik<ws||ik>=we) return {cls:'na'};
  if (c.status==='Freelook Cancellation') return {cls:'excl',reason:'Freelook'};
  const eff=pitStatus(c);
  if (eff==='In Force') return {cls:'100',reason:'In Force'};
  if (eff==='Contract Surrendered') return moPaid(c)>=13?{cls:'100',reason:'CS≥13mo'}:{cls:'0',reason:'CS<13mo'};
  return {cls:'0',reason:eff||'Lapsed'};
}
function clsCE(c) {
  if (!c.issueDate) return {cls:'na'};
  const ik=new Date(c.issueDate).getFullYear()*12+new Date(c.issueDate).getMonth();
  const vk=vKey(),ceM=vk-12;
  if (ik<ceM||ik>=vk) return {cls:'na'};
  if (c.status==='Freelook Cancellation') return {cls:'excl',reason:'Freelook'};
  if (c.dueDate) {
    const dk=new Date(c.dueDate).getFullYear()*12+new Date(c.dueDate).getMonth();
    if (dk===vk) return {cls:'100',reason:'Due this month',watch:true};
    if (dk<vk)  return {cls:'0',reason:'Due passed'};
  }
  if (c.status==='Contract Surrendered') return {cls:'0',reason:'CS'};
  if (c.payMethod==='Biro Angkasa')      return {cls:'100',reason:'BA'};
  return c.status==='In Force'?{cls:'100',reason:'In Force'}:{cls:'0',reason:c.status};
}
function clsPR25(c) {
  if (!c.issueDate) return {cls:'na'};
  const ik=new Date(c.issueDate).getFullYear()*12+new Date(c.issueDate).getMonth();
  const vk=vKey(),ws=vk-36,we=vk-24;
  if (ik<ws||ik>=we) return {cls:'na'};
  if (c.status==='Freelook Cancellation') return {cls:'excl',reason:'Freelook'};
  const eff=pitStatus(c);
  if (eff==='In Force') return {cls:'100',reason:'In Force'};
  if (eff==='Contract Surrendered') return moPaid(c)>=25?{cls:'100',reason:'CS≥25mo'}:{cls:'0',reason:'CS<25mo'};
  return {cls:'0',reason:'Lapsed'};
}

function calcM(clients,fn) {
  let eACE=0,cACE=0,zACE=0,xACE=0,eCnt=0; const rows=[];
  for (const c of clients) {
    const a=ace(c),r=fn(c);
    rows.push({...c,_cls:r.cls,_reason:r.reason||'',_ace:a,_watch:r.watch||false});
    if (r.cls==='na') continue;
    if (r.cls==='excl'){xACE+=a;continue;}
    eACE+=a;eCnt++;
    if (r.cls==='100') cACE+=a; else zACE+=a;
  }
  const rate=eACE>0?Math.round(cACE/eACE*10000)/100:null;
  return {rate,eACE,cACE,zACE,xACE,eCnt,rows};
}

/* ── BSC ─────────────────────────────── */
function k2aPts(v){return v>=95?150:v>=92.5?125:v>=90?100:v>=85?75:0}
function k2bPts(v){return v>=90?150:v>=85?125:v>=80?100:v>=75?75:0}
function band(s) {
  if (s>=100) return {lbl:'✨ Overperformer',color:'#27ae60',bg:'rgba(39,174,96,.15)'};
  if (s>=85)  return {lbl:'📊 Near Target',  color:'#f0a500',bg:'rgba(240,165,0,.15)'};
  return            {lbl:'⚠️ Below Standard',color:'#e53935',bg:'rgba(229,57,53,.15)'};
}
function ptsC(p){return p>=125?'#27ae60':p>=75?'#f0a500':'#e53935'}

/* ── Format ──────────────────────────── */
const RM=v=>'RM '+v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const RA=v=>'RM '+v.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const SN=n=>{const p=(n||'').split(' ');return p.length<=2?n:p.slice(0,2).join(' ')};
const INI=n=>(n||'').split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
const rateC=r=>r>=95?'#27ae60':r>=85?'#f0a500':'#e53935';
const rateCC=r=>r>=90?'#27ae60':r>=70?'#f0a500':'#e53935';

/* ── MTD / YTD helpers ───────────────── */
function mtdClients(clients) {
  return clients.filter(c=>{
    if (!c.issueDate) return false;
    const d=new Date(c.issueDate);
    return d.getFullYear()===VY&&d.getMonth()===VM;
  });
}
function ytdClients(clients) {
  return clients.filter(c=>{
    if (!c.issueDate) return false;
    const d=new Date(c.issueDate);
    return d.getFullYear()===VY&&d.getMonth()<=VM;
  });
}

/* ── Init ────────────────────────────── */
function initApp() {
  initDate();
  buildMonths();
  setUpdLbl();
  Promise.all([
    fetch('data/pr-data.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}),
    fetch('data/startup-data.json').then(r=>r.ok?r.json():null).catch(()=>null)
  ]).then(([pr, su])=>{
    DATA=pr;
    STARTUP_DATA=su;
    renderHome();
  }).catch(()=>{
    document.getElementById('homeContent').innerHTML='<div class="empty-msg">Gagal memuatkan data.</div>';
  });
}

/* boot */
if (sessionStorage.getItem('212_ok')==='1') {
  document.getElementById('pinOverlay').style.display='none';
  document.getElementById('app').style.display='block';
  initApp();
}

/* ── Navigation ──────────────────────── */
function showHome() {
  if(_ACT_UNSUB){_ACT_UNSUB();_ACT_UNSUB=null;}
  CUR=null;
  document.getElementById('viewHome').style.display='';
  document.getElementById('viewDash').style.display='none';
  document.getElementById('subBar').style.display='none';
  renderHome();
}
function showDash(code) {
  CUR=code;
  document.getElementById('viewHome').style.display='none';
  document.getElementById('viewDash').style.display='';
  document.getElementById('subBar').style.display='';
  renderDash(code);
}
function switchTab(t) {
  document.getElementById('paneOv').style.display=t==='ov'?'':'none';
  document.getElementById('paneMp').style.display=t==='mp'?'':'none';
  document.getElementById('panePr').style.display=t==='pr'?'':'none';
  document.getElementById('paneActivity').style.display=t==='act'?'':'none';
  document.getElementById('paneSu').style.display=t==='su'?'':'none';
  document.getElementById('tabOv').classList.toggle('on',t==='ov');
  document.getElementById('tabMp').classList.toggle('on',t==='mp');
  document.getElementById('tabPr').classList.toggle('on',t==='pr');
  document.getElementById('tabAct').classList.toggle('on',t==='act');
  document.getElementById('tabSu').classList.toggle('on',t==='su');
  if(t==='act') loadActivity(CUR);
  if(t==='su') renderStartup(CUR);
}

/* ── Contest Leaderboard (home) ──────── */
function renderContestLeaderboard() {
  const start=CONTEST_START, end=CONTEST_END;
  const now=new Date().toISOString().slice(0,10);
  if (now<start||now>end) return '';

  const ranked = DATA.agents.filter(ag=>!EXCLUDE_AGENTS.has(ag.code)).map(ag=>{
    const myCl=(ag.clients||[]).filter(c=>c.issueDate>=start&&c.issueDate<=end);
    const myACE=myCl.reduce((s,c)=>s+ace(c),0);
    return {code:ag.code, name:SN(ag.name), ace:myACE, cases:myCl.length};
  }).sort((a,b)=>b.ace-a.ace);

  const medals=['🥇','🥈','🥉'];
  const rows=ranked.map((ag,i)=>{
    const pct=Math.min(100,ag.ace/CONTEST_TARGET*100);
    const bc=pct>=80?'#27ae60':pct>=50?'#f0a500':'#e53935';
    const isTop=i<3;
    return `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:${i<ranked.length-1?'1px solid #f5f5f5':'none'}${isTop?';background:transparent':''}" >
      <div style="font-size:${i<3?'1.2rem':'.82rem'};width:28px;text-align:center;flex-shrink:0;font-weight:900;color:#bbb">${medals[i]||i+1}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:900;font-size:.85rem;margin-bottom:3px">${ag.name}</div>
        <div class="prog-wrap" style="margin:0 0 2px"><div class="prog-bar" style="width:${pct.toFixed(1)}%;background:${bc}"></div></div>
        <div style="font-size:.61rem;color:#aaa;font-weight:700">${pct.toFixed(0)}% daripada ${RA(CONTEST_TARGET)} · ${ag.cases} kes</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-size:.95rem;font-weight:900;color:${bc}">${RA(ag.ace)}</div>
        ${ag.ace>=CONTEST_TARGET?'<div style="font-size:.6rem;color:#27ae60;font-weight:800">✓ Tercapai</div>':''}
      </div>
    </div>`;
  }).join('');

  return `<div class="card" style="margin-bottom:12px">
    <div class="card-hdr" style="background:linear-gradient(135deg,#b06000,#e87c25)">🏆 Road to Bali — Kedudukan Jul–Sep 2026</div>
    <div class="card-body" style="padding:10px 16px 14px">${rows}</div>
  </div>`;
}

/* ── Home — agent selection list ─────── */
function renderHome() {
  if (!DATA) return;

  const vk = vKey();
  const agCards = DATA.agents.filter(ag=>!EXCLUDE_AGENTS.has(ag.code)).map(ag=>{
    const cl = ag.clients||[];
    const m = mtdClients(cl).reduce((s,c)=>s+ace(c),0);
    const pct = Math.min(100, m/MTD_TARGET*100);
    const bc = pct>=100?'#27ae60':pct>=60?'#f0a500':'#e53935';
    const ra = calcM(cl,clsPR13), rb = calcM(cl,clsPR25), rCE = calcM(cl,clsCE);
    const ka=ra.rate!==null?k2aPts(ra.rate):0, kb=rb.rate!==null?k2bPts(rb.rate):0;
    const hasBsc=ra.rate!==null||rb.rate!==null;
    const bsc=hasBsc?55+ka*0.25+kb*0.30:null;
    const bd=bsc!==null?band(bsc):null;
    const isSu = STARTUP_AGENTS.has(ag.code);

    // Alert badges
    const overdueCount = cl.filter(c=>{
      if(!c.dueDate||c.status==='Freelook Cancellation'||(c.payMethod||'')==='Biro Angkasa')return false;
      const dk=new Date(c.dueDate).getFullYear()*12+new Date(c.dueDate).getMonth();
      return dk<=vk;
    }).length;
    const pr13Risk = ra.rate!==null && ra.rate<85;
    const ceRisk   = rCE.rate!==null && rCE.rate<85;
    const ceWatch  = rCE.rows ? rCE.rows.filter(r=>r._watch&&r._cls==='100').length : 0;
    const badges = [
      pr13Risk ? `<span class="alert-chip" style="background:rgba(229,57,53,.15);color:#e53935">⚠️ PR13 ${ra.rate.toFixed(0)}%</span>` : '',
      ceRisk   ? `<span class="alert-chip" style="background:rgba(229,57,53,.15);color:#e53935">⚠️ CE ${rCE.rate.toFixed(0)}%</span>` : '',
      ceWatch>0 ? `<span class="alert-chip" style="background:rgba(240,165,0,.15);color:#c77700">⏰ CE due ${ceWatch}</span>` : '',
      overdueCount>0 ? `<span class="alert-chip" style="background:rgba(229,57,53,.12);color:#c0392b">💸 ${overdueCount} overdue</span>` : '',
    ].join('');

    return `<div class="ag-card" onclick="showDash('${ag.code}')">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">
        <div class="ag-name">${SN(ag.name)}</div>
        ${isSu?'<span class="su-badge">🚀 Startup</span>':''}
      </div>
      <div class="ag-code">${ag.code}</div>
      <div class="prog-wrap"><div class="prog-bar" style="width:${pct.toFixed(0)}%;background:${bc}"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:.65rem;color:#666;margin-bottom:6px">
        <span>${RA(m)}</span><span>${pct.toFixed(0)}%</span>
      </div>
      ${bd?`<div class="band" style="color:${bd.color};background:${bd.bg}">${bd.lbl} ${bsc.toFixed(1)}%</div>`
          :`<div class="band" style="color:#aaa;background:#f0f0f0">—</div>`}
      ${badges ? `<div style="margin-top:5px">${badges}</div>` : ''}
    </div>`;
  }).join('');

  const freshLbl = DATA.updated ? `<span style="font-weight:600;color:#bbb;font-size:.62rem"> · Data: ${DATA.updated}</span>` : '';
  document.getElementById('homeContent').innerHTML = `
    ${renderContestLeaderboard()}
    <div class="sec-h" style="margin-top:4px">Pilih Agen — ${vLabel()}${freshLbl}</div>
    <div class="ag-grid">${agCards}</div>`;
}

/* ── Agent Dashboard ─────────────────── */
function renderDash(code) {
  if(_ACT_UNSUB){_ACT_UNSUB();_ACT_UNSUB=null;}
  const ag = DATA.agents.find(a=>a.code===code);
  if (!ag) return;
  const clients = agClients(code);
  const grp = PU==='U' ? getGroupForAgent(code) : null;

  const r13=calcM(clients,clsPR13), rCE=calcM(clients,clsCE), r25=calcM(clients,clsPR25);
  const ka=r13.rate!==null?k2aPts(r13.rate):0, kb=r25.rate!==null?k2bPts(r25.rate):0;
  const hasBsc=r13.rate!==null||r25.rate!==null;
  const bsc=hasBsc?55+ka*0.25+kb*0.30:null;
  const bd=bsc!==null?band(bsc):null;

  // Avatar: group logo in U mode, initials in P mode
  const avEl = document.getElementById('dashAv');
  if (grp && grp.logo) {
    avEl.innerHTML = `<img src="${grp.logo}" style="width:100%;height:100%;object-fit:contain;border-radius:11px;padding:3px;background:white">`;
  } else {
    avEl.innerHTML = '';
    avEl.textContent = INI(ag.name);
  }
  document.getElementById('dashName').textContent = grp ? grp.name : SN(ag.name);
  document.getElementById('dashCode').textContent  = grp
    ? `${grp.name} Group · ${grp.members.length} agen — ${vLabel()}`
    : `${ag.code} — ${vLabel()}`;
  const bc=document.getElementById('dashBand');
  if (bd){bc.textContent=bd.lbl+' '+bsc.toFixed(1)+'%';bc.style.color=bd.color;bc.style.background=bd.bg;}
  else {bc.textContent='No data';bc.style.color='#aaa';bc.style.background='#f0f0f0';}

  try{renderContest(code,grp);}catch(e){console.error('contest',e);}
  try{renderMTD(clients,code,grp);}catch(e){console.error('mtd',e);}
  try{renderCE(r13,rCE);}catch(e){console.error('ce',e);}
  try{renderBSC(r13,r25,ka,kb,bsc,bd);}catch(e){console.error('bsc',e);}
  try{renderMP(clients);}catch(e){console.error('mp',e);document.getElementById('mpCard').innerHTML='<div class="card"><div class="card-hdr hdr-red">💸 Koleksi Manual</div><div class="card-body"><div class="empty-msg">Ralat memuatkan data.</div></div></div>';}
  try{renderPR(r13,rCE,r25);}catch(e){console.error('pr',e);}
  const suTab = document.getElementById('tabSu');
  suTab.style.display = STARTUP_AGENTS.has(code) ? '' : 'none';
  switchTab('ov');
}

/* ── SVG Donut helper ────────────────── */
function suDonut(pct, color, label) {
  const r=36, cx=50, cy=50, sw=8;
  const circ=2*Math.PI*r;
  const dash=circ*Math.min(pct,100)/100;
  const trackColor = document.body.dataset.theme==='dark' ? '#3a1a5a' : '#e9d5ff';
  return `<svg viewBox="0 0 100 100" width="90" height="90" style="display:block;flex-shrink:0">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${trackColor}" stroke-width="${sw}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"
      stroke-dasharray="${dash.toFixed(2)} ${circ.toFixed(2)}"
      stroke-dashoffset="${(circ/4).toFixed(2)}" stroke-linecap="round"/>
    <text x="50" y="46" text-anchor="middle" dominant-baseline="middle"
      font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
      font-size="15" font-weight="900" fill="${color}">${pct.toFixed(0)}%</text>
    <text x="50" y="60" text-anchor="middle" dominant-baseline="middle"
      font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
      font-size="8" font-weight="700" fill="#aaa">${label}</text>
  </svg>`;
}

  const bc=pct>=100?'#27ae60':pct>=60?'#f0a500':'#e53935';
  const showComm=!NO_COMMISSION.has(agCode);
  const mtdComm=mtd*COMM_RATE, ytdComm=ytd*COMM_RATE;
  const cardTitle = grp ? `📈 Pengeluaran MTD — ${grp.name} — ${vLabel()}` : `📈 Pengeluaran MTD — ${vLabel()}`;

/* ── Manual Payment helpers ──────────────────────────────────────── */
function _212_mpPaid() {
  try { return new Set(JSON.parse(localStorage.getItem('tsla_212_paid') || '[]')); }
  catch(e) { return new Set(); }
}
function _212_mpTogglePaid(certNo) {
  const s = _212_mpPaid();
  if (s.has(certNo)) s.delete(certNo); else s.add(certNo);
  localStorage.setItem('tsla_212_paid', JSON.stringify([...s]));
  _renderMP212();
}
function _212_mpComm(c) { return Math.round((c.contribution || 0) * 0.32 * 100) / 100; }
function _212_matchMpFilter(c) {
  if (_MP_FILTER === 'inforce') return c.status === 'In Force';
  if (_MP_FILTER === 'lapsed')  return c.status === 'Lapsed' || c.status === 'Contract Surrendered';
  return true;
}
function _212_setMpFilter(f) { _MP_FILTER = f; _renderMP212(); }

function _212_mpClientName(c, isPaid) {
  return `<div class="sp-cl-name" style="${isPaid ? 'text-decoration:line-through;color:#aaa' : ''}">${c.name || '—'}${isPaid ? '<span style="font-size:.6rem;font-weight:800;color:#0a9b43;background:rgba(10,155,67,.12);padding:1px 6px;border-radius:6px;margin-left:5px">✓ Paid</span>' : ''}</div>`;
}
function _212_mpClientRight(c, isPaid, safeCert) {
  const contrib    = c.contribution ? 'RM ' + RA(c.contribution) + '/mo' : '—';
  const commission = c.contribution ? 'RM ' + RA(_212_mpComm(c)) : '—';
  return `<div class="sp-cl-right">

    <div style="font-size:.66rem;color:#e53935;font-weight:800;margin-top:2px">💸 ${commission}</div>

}

function _renderMP212() {
  const el = document.getElementById('mpCard');
  if (!el) return;
  const vk  = vKey();
  const paid = _212_mpPaid();

  // BA Transition: BA clients issued in last 3 months
  const baClients = _MP_CLIENTS.filter(c => {
    if (!c.issueDate) return false;
    if (c.status === 'Freelook Cancellation') return false;
    if ((c.payMethod || '') !== 'Biro Angkasa') return false;
    const ik = new Date(c.issueDate).getFullYear() * 12 + new Date(c.issueDate).getMonth();
    return ik >= vk - 2 && ik <= vk;
  }).map(c => {
    const ik = new Date(c.issueDate).getFullYear() * 12 + new Date(c.issueDate).getMonth();
    const dk = c.dueDate ? new Date(c.dueDate).getFullYear() * 12 + new Date(c.dueDate).getMonth() : null;
    return { ...c, _monthsSinceIssue: vk - ik, _monthsOverdue: dk !== null ? vk - dk : null };
  }).sort((a, b) => b._monthsSinceIssue - a._monthsSinceIssue);

  // Overdue: non-BA, dueKey <= vk, not Freelook
  const overdueAll = _MP_CLIENTS.filter(c => {
    if (!c.dueDate) return false;
    if (c.status === 'Freelook Cancellation') return false;
    if ((c.payMethod || '') === 'Biro Angkasa') return false;
    const dk = new Date(c.dueDate).getFullYear() * 12 + new Date(c.dueDate).getMonth();
    return dk <= vk;
  }).map(c => {
    const dk = new Date(c.dueDate).getFullYear() * 12 + new Date(c.dueDate).getMonth();
    return { ...c, _monthsOverdue: vk - dk };
  });
  const overdueFiltered = overdueAll.filter(_212_matchMpFilter).sort((a, b) => b._monthsOverdue - a._monthsOverdue);

  const baRowHtml = c => {
    const stage = c._monthsSinceIssue === 0 ? { pill: '1️⃣', label: 'Bulan 1 — closing (bayar sekarang)',      bg: 'rgba(255,152,0,.07)',  bdr: '#f9a825' }

                :                             { pill: '3️⃣', label: 'Bulan 3 — sahkan potongan Angkasa',        bg: 'rgba(229,57,53,.05)',  bdr: '#e53935' };

    const ovLabel  = c._monthsOverdue !== null
      ? `<span class="sp-tag2" style="color:${c._monthsOverdue<=0?'#27ae60':c._monthsOverdue===1?'#c77700':'#e53935'};background:${c._monthsOverdue<=0?'rgba(39,174,96,.1)':c._monthsOverdue===1?'rgba(199,119,0,.1)':'rgba(229,57,53,.1)'}">${c._monthsOverdue<=0?'Bulan ini':c._monthsOverdue===1?'1 bln overdue':c._monthsOverdue+' bln overdue'}</span>` : '';
    return `<div class="sp-cl-row" style="background:${stage.bg};border-left-color:${stage.bdr}${isPaid?';opacity:.4':''}">
      <div class="sp-cl-info">
        ${_212_mpClientName(c, isPaid)}
        <div class="sp-cl-meta">${c.certNo||''} · Due ${c.dueDate||'—'} · ${c.plan||''}</div>
        <div class="sp-cl-tags">
          ${sChip}
          <span class="sp-tag2" style="color:#64b5f6;background:rgba(100,181,246,.15)">BA</span>
          ${ovLabel}
          <span class="sp-tag2" style="color:${stage.bdr};border:1px solid ${stage.bdr}40">${stage.pill} ${stage.label}</span>
        </div>
      </div>
      ${_212_mpClientRight(c, isPaid, safeCert)}
    </div>`;
  };

  const overdueRowHtml = c => {
    const urgency = c._monthsOverdue >= 3 ? { bg: 'rgba(229,57,53,.06)', bdr: '#e53935', pill: '🔴' }
                  : c._monthsOverdue === 2 ? { bg: 'rgba(255,152,0,.06)', bdr: '#f9a825', pill: '🟠' }
                  : c._monthsOverdue === 1 ? { bg: 'rgba(255,193,7,.06)', bdr: '#c77700', pill: '🟡' }
                  :                          { bg: 'rgba(255,193,7,.04)', bdr: '#c77700', pill: '⏳' };
    const label  = c._monthsOverdue === 0 ? 'Bulan ini — belum bayar'
                 : c._monthsOverdue === 1 ? '1 bulan overdue'
                 : `${c._monthsOverdue} bulan overdue`;
    const isPaid   = paid.has(c.certNo);
    const safeCert = (c.certNo || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    const sChip    = c.status === 'In Force'
      ? `<span class="sp-tag2" style="color:#27ae60;background:rgba(39,174,96,.15)">IF</span>`
      : `<span class="sp-tag2" style="color:#e53935;background:rgba(229,57,53,.15)">${c.status}</span>`;
    const methodLabel = (c.payMethod || c.payMode || '—')
      .replace('Credit Card - IPAY88','CC-IPAY').replace('Credit Card - Razer','CC-Razer')
      .replace('Direct Billing (Cash)','Cash').replace('Credit Card','CC');
    return `<div class="sp-cl-row" style="background:${urgency.bg};border-left-color:${urgency.bdr}${isPaid?';opacity:.4':''}">

const CONTEST_START  = '2026-07-01';
const CONTEST_END    = '2026-09-30';
const CONTEST_TARGET = 50000;

function renderContest(agCode, grp) {
  const start=new Date(CONTEST_START), end=new Date(CONTEST_END), now=new Date();
  const totalDays=Math.round((end-start)/86400000);
  const daysLeft=Math.max(0,Math.round((end-now)/86400000));
  const timePct=totalDays>0?Math.min(100,Math.round((now-start)/86400000)/totalDays*100):0;

  // Contest is personal production — always use the agent's own clients, never group
  const agObj = DATA.agents.find(a=>a.code===agCode);
  const myCl  = (agObj?.clients||[]).filter(c=>c.issueDate>=CONTEST_START&&c.issueDate<=CONTEST_END);
  const myACE = myCl.reduce((s,c)=>s+ace(c),0);

  const pct      = Math.min(100, myACE/CONTEST_TARGET*100);
  const barC     = pct>=80?'#27ae60':pct>=50?'#f0a500':'#e53935';
  const shortfall= Math.max(0, CONTEST_TARGET-myACE);

  document.getElementById('contestCard').innerHTML=`
    <div class="card" style="margin-bottom:12px">
      <div class="card-hdr" style="background:linear-gradient(135deg,#b06000,#e87c25)">🏆 Road to Bali — Jul–Sep 2026</div>
      <div class="card-body">
        <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px">
          <div>
            <div class="st-lbl">Pengeluaran Peribadi</div>
            <div class="big-num" style="color:${barC}">${RA(myACE)}</div>
            <div class="st-sub">Target peribadi: ${RA(CONTEST_TARGET)}${shortfall>0?' · Shortfall: '+RA(shortfall):' ✓ Achieved!'}</div>
          </div>
          <div style="text-align:right">
            <div class="st-lbl">Kes Contest</div>
            <div style="font-size:1.15rem;font-weight:900;color:#f0a500">${myCl.length} kes</div>
            <div class="st-sub">${daysLeft} hari lagi</div>
          </div>
        </div>
        <div class="prog-wrap">
          <div class="prog-bar" style="width:${pct.toFixed(1)}%;background:${barC}"></div>
        </div>
        <div class="pct-row">
          <span>${pct.toFixed(1)}% daripada target peribadi (${RA(CONTEST_TARGET)})</span>
          <span>Masa: ${timePct.toFixed(0)}% berlalu</span>
        </div>
      </div>
    </div>`;
}

function _212_renderAuditTable(){
  const pool=_PR_POOL;
  const poolRows=pool==='CE'
    ?_PR_ROWS.filter(r=>r._pool==='CE')
    :_PR_ROWS.filter(r=>r._pool==='PR13'||r._pool===null);
  const clsOrd={'0':1,'excl':2,'na':3,'100':4};
  const _ik=c=>new Date(c.issueDate).getFullYear()*12+new Date(c.issueDate).getMonth();
  const _moLeft=c=>pool==='PR13'?(_ik(c)+25-vKey()):(_ik(c)+13-vKey());
  const sorted=[...poolRows].sort((a,b)=>{
    const aw=a._watch?0:99, bw=b._watch?0:99;
    if(aw!==bw) return aw-bw;
    const ao=clsOrd[a._cls]??3, bo=clsOrd[b._cls]??3;
    if(ao!==bo) return ao-bo;
    if(a._cls==='0') return _moLeft(a)-_moLeft(b);
    return 0;
  });
  const metric=pool==='PR13'?_PR_R13:_PR_CE;
  const rate=metric.rate;
  const clsH=(cls,w)=>{
    if(cls==='100')return`<span class="ar-cls ar-100">${w?'⚠️ ':''}100%</span>`;
    if(cls==='0')  return`<span class="ar-cls ar-0">0%</span>`;
    if(cls==='excl')return`<span class="ar-cls ar-excl">Excl</span>`;
    return`<span class="ar-cls ar-na">–</span>`;
  };
  const stH=s=>{
    if(s==='In Force')             return`<span class="ar-st ar-if">IF</span>`;
    if(s==='Lapsed')               return`<span class="ar-st ar-lp">Lapsed</span>`;
    if(s==='Contract Surrendered') return`<span class="ar-st ar-cs">CS</span>`;
    return`<span class="ar-st ar-cs">${(s||'—').substring(0,4)}</span>`;
  };
  const pmShort=m=>(m||'—').replace('Biro Angkasa','BA').replace('Direct Debit','DD')
    .replace('Credit Card - IPAY88','CC-IPAY').replace('Credit Card - Razer','CC-Razer')
    .replace('Credit Card','CC').replace('Direct Billing (Cash)','Cash');
  ['prSearch','prFcls','prFst','prFdue'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
  const vk=vKey();
  document.getElementById('prBody').innerHTML=sorted.map((c,i)=>{
    const isDim=c._cls==='na'||c._cls==='excl';
    const isBA=c.payMethod==='Biro Angkasa'&&c.status!=='Contract Surrendered'&&c.status!=='Freelook Cancellation';
    const dispCls=isBA?'100':c._cls;
    const cbHtml=dispCls==='0'?`<input type="checkbox" class="zcb" data-ace="${c._ace}" data-pool="${pool}" onchange="_212_updateProj()"> `:'';
    const dk=c.dueDate?new Date(c.dueDate).getFullYear()*12+new Date(c.dueDate).getMonth():-1;
    const dc=dk<0?'#555':dk===vk?'#f0a500':dk<vk?'#e53935':'#777';
    const moLeft = c._cls==='0'&&!isDim ? _moLeft(c) : null;
    const urgBadge = moLeft!==null
      ? `<span style="font-size:.59rem;font-weight:800;padding:1px 5px;border-radius:5px;display:inline-block;margin-top:2px;color:${moLeft<=2?'#c62828':moLeft<=4?'#e68a00':'#555'};background:${moLeft<=2?'rgba(229,57,53,.12)':moLeft<=4?'rgba(255,152,0,.12)':'rgba(0,0,0,.06)'}">⏱ ${moLeft} bln lagi</span>`
      : '';
    return`<tr class="${isDim?'dim-r':''}" style="${c._watch?'background:rgba(199,119,0,.08)':c.status==='Lapsed'?'background:rgba(229,57,53,.05)':''}" data-name="${(c.name||'').toLowerCase().replace(/"/g,'')}" data-cert="${(c.certNo||'').toLowerCase().replace(/^fwd\//,'')}" data-cls="${dispCls}" data-status="${c.status||''}" data-duekey="${dk}">
      <td style="color:#555;white-space:nowrap">${cbHtml}${i+1}</td>
      <td><div style="font-weight:700;color:#111;font-size:.77rem">${c.name||'—'}</div>${c._watch?'<span style="font-size:.59rem;font-weight:800;color:#e68a00;background:rgba(255,152,0,.12);padding:1px 5px;border-radius:5px;display:inline-block;margin-top:2px">⚠️ Due this month</span>':''}${urgBadge}<div style="font-size:.62rem;color:#aaa;margin-top:1px">${(c.certNo||'').replace(/^FWD\//,'')}</div></td>
      <td style="white-space:nowrap;color:#666">${c.issueDate||'—'}</td>
      <td style="white-space:nowrap;color:${dc};font-weight:700">${c.dueDate||'—'}</td>
      <td style="color:#666">${c.payMode||'—'}</td>
      <td class="r" style="color:${dispCls==='0'?'#e53935':'#555'}">${isDim?'—':RA(c._ace)}</td>
      <td style="color:#666">${pmShort(c.payMethod)}</td>
      <td>${stH(c.status)}</td>
      <td>${clsH(dispCls,c._watch)}</td>
      <td style="color:${c._watch?'#f0a500':'#555'}">${isBA?'Biro Angkasa':c._reason}</td>
    </tr>`;
  }).join('');
  const foot=document.getElementById('prFoot');
  if(rate!==null&&metric.eACE>0){
    const col=pool==='PR13'?'#27ae60':'#5c9ee8';
    const bg=pool==='PR13'?'rgba(39,174,96,.08)':'rgba(26,115,232,.08)';
    foot.innerHTML=`<tr style="background:${bg}"><td colspan="5" style="text-align:right;font-size:.82rem;font-weight:900;color:${col}">${pool} = ${RA(metric.cACE)} ÷ ${RA(metric.eACE)} × 100</td><td class="r" style="color:${col};font-size:.96rem">${rate.toFixed(2)}%</td><td colspan="4"></td></tr>`;
  } else {foot.innerHTML='';}
  _212_updateProj();
}

function _212fa(){
  const q=(document.getElementById('prSearch')?.value||'').trim().toLowerCase();
  const cls=document.getElementById('prFcls')?.value||'';
  const st=document.getElementById('prFst')?.value||'';
  const due=document.getElementById('prFdue')?.value||'';
  const now=new Date();now.setHours(0,0,0,0);
  const tk=now.getFullYear()*12+now.getMonth(), nk=tk+1;
  document.querySelectorAll('#prBody tr').forEach(tr=>{
    const mq=!q||(tr.dataset.name||'').includes(q)||(tr.dataset.cert||'').includes(q);
    const mc=!cls||tr.dataset.cls===cls;
    const ms=!st||tr.dataset.status===st;
    let md=true;
    if(due){const dk=parseInt(tr.dataset.duekey||'-1');
      if(due==='overdue')    md=dk>=0&&dk<tk;
      else if(due==='this-month')md=dk===tk;
      else if(due==='next-month')md=dk===nk;}
    tr.style.display=mq&&mc&&ms&&md?'':'none';
  });
}

function _212_updateProj(){
  const pool=_PR_POOL;
  const metric=pool==='PR13'?_PR_R13:_PR_CE;
  if(!metric)return;
  let addACE=0;
  document.querySelectorAll('.zcb:checked').forEach(cb=>{if(cb.dataset.pool===pool)addACE+=parseFloat(cb.dataset.ace)||0;});
  const bar=document.getElementById('projBar');if(!bar)return;
  if(addACE>0&&metric.eACE>0){
    const projRate=Math.round((metric.cACE+addACE)/metric.eACE*1000)/10;
    const col=pool==='PR13'?'#27ae60':'#5c9ee8';
    const base=metric.rate!==null?`<span style="color:#666">${metric.rate.toFixed(2)}%</span> <span style="color:#444">→</span> `:'';
    const delta=metric.rate!==null?` <span style="color:${col}">(+${(projRate-metric.rate).toFixed(2)}%)</span>`:'';
    bar.innerHTML=`<span style="font-weight:900">🎯 ${pool} jika dikutip:</span> ${base}<strong style="color:${col};font-size:.9rem">${projRate.toFixed(2)}%</strong>${delta} <span style="font-size:.7rem;color:#555">${RA(addACE)} ACE</span>`;
    bar.style.display='flex';
  } else {bar.style.display='none';}
}

function renderPR(r13,rCE,r25){
  _PR_R13=r13; _PR_CE=rCE;

    return{...pr13Row,_pool:null,_watch:false};
  });
  _212_renderPrSummary(r13,rCE);
  _212_renderPoolTabs();
  _212_renderAuditTable();
}

    <a href="activity-tracker.html" target="_blank" class="act-link-btn">🔗 Papan Aktiviti Penuh — Semua Agen</a>`;

  _actUpdateDateNav();

  const ref = _FB_DB.ref('activity');
  const listener = ref.on('value', snap => {
    _ACT_ALL_DATA = snap.val() || {};
    _actPopulateInputs(code);
    _actRenderView(code, agName);
    _actRenderHistory(code);
  }, () => {
    const body = document.getElementById('actSummaryBody');
    if (body) body.innerHTML = '<div class="empty-msg" style="padding:16px">Gagal memuatkan aktiviti.</div>';
  });
  _ACT_UNSUB = () => ref.off('value', listener);
}

function _actUpdateDateNav() {
  const today = todayStr();
  const vd  = _ACT_VIEW_DATE || today;
  const ym  = vd.slice(0,7);
  const todayYm = today.slice(0,7);
  const lbl  = document.getElementById('actDateLabel');
  const sub  = document.getElementById('actDateSub');
  const next = document.getElementById('actNextBtn');
  if (!lbl) return;
  if (_ACT_TAB_ACT === 'monthly') {
    const mLabel = new Date(ym + '-01T00:00:00').toLocaleString('en-MY', {month:'long',year:'numeric'});
    lbl.textContent = mLabel;
    sub.textContent = '';
    if (next) next.disabled = ym >= todayYm;
  } else {
    const parts = _actFmtDate(vd).split(', ');
    lbl.textContent = vd === today ? 'Today' : (parts[0] || _actFmtDate(vd));
    sub.textContent = vd === today ? _actFmtDateShort(vd) : (parts.slice(1).join(', ') || '');
    if (next) next.disabled = vd >= today;
  }
}

function _actShift(delta) {
  const today = todayStr();
  if (_ACT_TAB_ACT === 'monthly') {
    const ym = (_ACT_VIEW_DATE||today).slice(0,7);
    const [y2,m2] = ym.split('-').map(Number);
    const dt = new Date(y2, m2-1+delta, 1);
    _ACT_VIEW_DATE = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-01`;
  } else {
    const [y,m,d] = (_ACT_VIEW_DATE||today).split('-').map(Number);
    const dt = new Date(y,m-1,d+delta);
    _ACT_VIEW_DATE = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  }
  const code = actCode(CUR);
  const ag = DATA ? DATA.agents.find(a=>a.code===CUR) : null;
  _actUpdateDateNav();
  _actPopulateInputs(code);
  _actRenderView(code, ag ? ag.name : code);
}

function _actSetTab(t) {
  _ACT_TAB_ACT = t;
  const dBtn = document.getElementById('actStabDaily');
  const mBtn = document.getElementById('actStabMonthly');
  if (dBtn) dBtn.classList.toggle('active', t==='daily');
  if (mBtn) mBtn.classList.toggle('active', t==='monthly');
  _actUpdateDateNav();
  const code = actCode(CUR);
  const ag = DATA ? DATA.agents.find(a=>a.code===CUR) : null;
  _actRenderView(code, ag ? ag.name : code);
}

function _actPopulateInputs(code) {
  const vd = _ACT_VIEW_DATE || todayStr();
  const existing = (_ACT_ALL_DATA[vd] && _ACT_ALL_DATA[vd][code]) || {};
  const pInp = document.getElementById('actPresentInp');
  const cInp = document.getElementById('actCloseInp');
  if (pInp) pInp.value = existing.present != null ? existing.present : '';
  if (cInp) cInp.value = existing.close   != null ? existing.close   : '';
}

function _actRenderView(code, agName) {
  if (_ACT_TAB_ACT === 'monthly') { _actRenderMonthly(code); } else { _actRenderDaily(code); }
}

function _actRenderDaily(code) {
  const body = document.getElementById('actSummaryBody');
  if (!body) return;
  const vd = _ACT_VIEW_DATE || todayStr();
  const existing = (_ACT_ALL_DATA[vd] && _ACT_ALL_DATA[vd][code]) || {};
  const present = existing.present || 0;
  const close   = existing.close   || 0;
  const expected = Math.floor(present / 5);
  const pending  = Math.max(0, expected - close);
  const rem      = present % 5;
  const toNext   = rem === 0 ? 5 : 5 - rem;
  const progPct  = present === 0 ? 0 : rem === 0 ? 100 : Math.round((rem / 5) * 100);

  let alertHtml = '';
  if (present === 0 && close === 0) {
    alertHtml = `<div class="act-amod-good"><span style="font-size:1.3rem">📭</span><span class="act-amod-good-text">Tiada rekod aktiviti untuk tarikh ini.</span></div>`;
  } else if (pending > 0) {
    alertHtml = `<div class="act-amod-alert"><span style="font-size:1.3rem;flex-shrink:0;margin-top:1px">⚠️</span><div>
      <div class="act-amod-alert-title">${pending} close pending — ready to close!</div>
      <div class="act-amod-alert-sub">${present} presentations ÷ 5 = ${expected} expected close. Only ${close} recorded.</div>
    </div></div>`;
  } else if (expected > 0 && pending === 0) {
    alertHtml = `<div class="act-amod-good"><span style="font-size:1.3rem">✅</span><span class="act-amod-good-text">All expected closes recorded. Great work!</span></div>`;
  }

  const progNote = present === 0
    ? 'Mula log presentations'
    : rem === 0
      ? `At bracket — ${expected} expected close${expected>1?'s':''}. Next bracket in 5 more.`
      : `${toNext} more presentation${toNext>1?'s':''} to next expected close`;

  body.innerHTML = `<div style="padding:14px 16px">
    <div class="act-totals-strip">
      <div class="act-total-box"><div class="act-total-lbl present">Aktiviti</div><div class="act-total-val present">${present}</div></div>
      <div class="act-total-box"><div class="act-total-lbl close">Close</div><div class="act-total-val close">${close}</div></div>
    </div>
    <div class="act-amod-derived">
      <div class="act-amod-d-box"><div class="act-amod-d-lbl">Expected Close</div><div class="act-amod-d-val" style="color:#ff7a00">${expected}</div></div>
      <div class="act-amod-d-box"><div class="act-amod-d-lbl">Pending Close</div><div class="act-amod-d-val" style="color:${pending>0?'#e53935':'#0a9b43'}">${pending}</div></div>
    </div>
    <div class="act-amod-progress">
      <div class="act-amod-prog-lbl">Progress to next bracket</div>
      <div class="act-amod-prog-bar-wrap"><div class="act-amod-prog-bar" style="width:${progPct}%"></div></div>
      <div class="act-amod-prog-note">${progNote}</div>
    </div>
    ${alertHtml}
  </div>`;
}

function _actRenderMonthly(code) {
  const body = document.getElementById('actSummaryBody');
  if (!body) return;
  const today = todayStr();
  const ym = (_ACT_VIEW_DATE||today).slice(0,7);
  const monthLabel = new Date(ym + '-01T00:00:00').toLocaleString('en-MY', {month:'long',year:'numeric'});

  let totalPresent = 0, totalClose = 0;
  const rows = [];
  Object.keys(_ACT_ALL_DATA).sort().filter(d => d.startsWith(ym)).forEach(date => {
    const e = (_ACT_ALL_DATA[date]||{})[code];
    if (!e) return;
    const p = e.present||0, cl = e.close||0;
    totalPresent += p; totalClose += cl;
    rows.push({ date, p, cl, updatedAt: e.updatedAt||'' });
  });

  if (rows.length === 0) {
    body.innerHTML = `<div class="empty-msg" style="padding:16px">Tiada rekod untuk ${monthLabel}.</div>`;
    return;
  }

  const expected = Math.floor(totalPresent / 5);
  const pending  = Math.max(0, expected - totalClose);
  rows.sort((a,b) => b.date.localeCompare(a.date));

  let tableHtml = `<table class="act-mo-table"><thead><tr>
    <th>Tarikh</th><th class="num">Aktiviti</th><th class="num">Close</th><th class="num">Updated</th>
  </tr></thead><tbody>`;
  rows.forEach(r => {
    tableHtml += `<tr onclick="_actGoDate('${r.date}')">
      <td><div class="mo-name">${_actFmtDateShort(r.date)}</div></td>
      <td class="num"><span class="${r.p>0?'mo-val-p':'mo-val-z'}">${r.p||'—'}</span></td>
      <td class="num"><span class="${r.cl>0?'mo-val-c':'mo-val-z'}">${r.cl||'—'}</span></td>
      <td class="num"><span style="font-size:.7rem;color:#bbb;font-family:monospace">${r.updatedAt}</span></td>
    </tr>`;
  });
  tableHtml += '</tbody></table>';

  body.innerHTML = `
    <div style="padding:10px 16px 4px;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:#bbb">${monthLabel}</div>
    <div class="act-totals-strip">
      <div class="act-total-box"><div class="act-total-lbl present">Total Aktiviti</div><div class="act-total-val present">${totalPresent}</div></div>
      <div class="act-total-box"><div class="act-total-lbl close">Total Close</div><div class="act-total-val close">${totalClose}</div></div>
    </div>
    <div style="padding:0 16px 8px;display:flex;gap:12px;font-size:.78rem;font-weight:700;color:#555">
      <span>Expected: <span style="color:#ff7a00">${expected}</span></span>
      <span>Pending: <span style="color:${pending>0?'#e53935':'#0a9b43'}">${pending}</span></span>
    </div>
    ${tableHtml}`;
}

function _actRenderHistory(code) {
  const card = document.getElementById('actHistoryCard');
  const body = document.getElementById('actHistoryBody');
  if (!card || !body) return;
  const vd = _ACT_VIEW_DATE || todayStr();
  const dates = Object.keys(_ACT_ALL_DATA)
    .filter(d => d !== vd && (_ACT_ALL_DATA[d]||{})[code])
    .sort().reverse().slice(0, 7);
  if (!dates.length) { card.style.display='none'; return; }
  card.style.display = '';
  body.innerHTML = dates.map(ds => {
    const e = (_ACT_ALL_DATA[ds]||{})[code]||{};
    return `<div class="act-hist-row" onclick="_actGoDate('${ds}')">
      <div class="act-hist-date">${_actFmtDateShort(ds)}</div>
      <div class="act-hist-nums">
        <span class="act-num-chip act-present">▲ ${e.present||0}</span>
        <span class="act-num-chip act-close">✓ ${e.close||0}</span>
      </div>
    </div>`;
  }).join('');
}

function _actGoDate(ds) {
  _ACT_VIEW_DATE = ds;
  _ACT_TAB_ACT = 'daily';
  const dBtn = document.getElementById('actStabDaily');
  const mBtn = document.getElementById('actStabMonthly');
  if (dBtn) { dBtn.classList.add('active'); }
  if (mBtn) { mBtn.classList.remove('active'); }
  _actUpdateDateNav();
  const code = actCode(CUR);
  const ag = DATA ? DATA.agents.find(a=>a.code===CUR) : null;
  _actPopulateInputs(code);
  _actRenderView(code, ag ? ag.name : code);
}

function submitActivity() {
  const presentVal = Math.max(0, parseInt(document.getElementById('actPresentInp')?.value||'0')||0);
  const closeVal   = Math.max(0, parseInt(document.getElementById('actCloseInp')?.value  ||'0')||0);
  const db = _initFirebase();
  if (!db || !CUR) return;
  const vd = _ACT_VIEW_DATE || todayStr();
  const code = actCode(CUR);
  const ag   = DATA ? DATA.agents.find(a=>a.code===CUR) : null;
  const agName = ag ? ag.name : code;
  const msgEl = document.getElementById('actMsg');
  const btn   = document.getElementById('actSubmitBtn');
  if (msgEl) { msgEl.style.color='#555'; msgEl.textContent='Menyimpan…'; }
  if (btn) { btn.disabled=true; btn.textContent='Saving…'; }
  const now = new Date();
  const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  db.ref(`activity/${vd}/${code}`).set({
    present: presentVal, close: closeVal, name: agName, updatedAt: timeStr,
  }).then(() => {
    if (msgEl) { msgEl.style.color='#27ae60'; msgEl.textContent=`✓ Tersimpan! (${vd})`; setTimeout(()=>{if(msgEl)msgEl.textContent='';},2500); }
  }).catch(() => {
    if (msgEl) { msgEl.style.color='#e53935'; msgEl.textContent='Ralat menyimpan. Cuba lagi.'; }
  }).finally(() => {
    if (btn) { btn.disabled=false; btn.textContent='Update Aktiviti'; }
  });
}
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</body>
