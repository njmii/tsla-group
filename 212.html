<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Two1two — Agent Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#2b2b2b;color:#f0f0f0;min-height:100vh}
.container{max-width:680px;margin:0 auto;padding:0 0 80px}

/* PIN */
#pinOverlay{position:fixed;inset:0;background:#2b2b2b;z-index:999;display:flex;align-items:center;justify-content:center}
.pin-box{background:#383838;border-radius:24px;padding:36px 28px;width:320px;max-width:90vw;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.5)}
.pin-logo-img{width:72px;height:auto;margin-bottom:14px}
.pin-title{font-weight:900;font-size:1.4rem;margin-bottom:5px;color:#f0f0f0}
.pin-sub{color:#777;font-size:.82rem;margin-bottom:24px}
.pin-input{width:100%;border:2px solid #555;border-radius:14px;padding:14px;font-size:1.6rem;text-align:center;letter-spacing:.4em;outline:none;font-weight:700;background:#2b2b2b;color:#f0f0f0;transition:.15s;-webkit-text-security:disc}
.pin-input:focus{border-color:#f07d26}
.pin-err{color:#e53935;font-size:.8rem;margin-top:8px;min-height:18px;font-weight:700}
.pin-btn{margin-top:16px;width:100%;background:#f07d26;color:#fff;border:none;border-radius:14px;padding:14px;font-size:1rem;font-weight:800;cursor:pointer}
.pin-btn:active{opacity:.85}

/* App hidden until unlocked */
#app{display:none}

/* Top bar */
.top-bar{background:#f07d26;padding:13px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.top-logo{width:34px;height:34px;object-fit:contain;filter:brightness(0) invert(1)}
.top-brand{font-weight:900;font-size:1.1rem;color:#fff;flex:1}
.month-sel{background:rgba(0,0,0,.3);color:#fff;border:none;border-radius:10px;padding:7px 10px;font-size:.82rem;font-weight:700;cursor:pointer;outline:none;-webkit-appearance:none;appearance:none}
.month-sel option{background:#333;color:#f0f0f0}

/* Sub bar */
.sub-bar{background:#333;padding:9px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.05)}
.pu-wrap{display:flex;border-radius:10px;overflow:hidden;border:2px solid #f07d26}
.pu-btn{border:none;background:transparent;color:#f07d26;padding:5px 18px;font-size:.82rem;font-weight:900;cursor:pointer;transition:.12s}
.pu-btn.on{background:#f07d26;color:#fff}
.upd-lbl{font-size:.7rem;color:#f07d26;font-weight:700}

/* Content padding */
.content{padding:13px 13px 0}

/* Cards */
.card{background:#383838;border-radius:18px;overflow:hidden;margin-bottom:12px;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.card-hdr{padding:11px 16px;font-size:.75rem;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:#fff}
.card-body{padding:14px 16px 16px}
.hdr-orange{background:#e87c25}
.hdr-red{background:#c0392b}
.hdr-purple{background:#6b5bef}
.hdr-teal{background:#028090}
.hdr-violet{background:#7b1fa2}
.hdr-slate{background:#455a64}
.hdr-dark{background:#3d3d3d}

/* Two-col grid */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.g2 .card{margin-bottom:0}

/* Stat display */
.st-lbl{font-size:.63rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#777;margin-bottom:3px}
.st-val{font-size:1.45rem;font-weight:900;letter-spacing:-.02em}
.st-sub{font-size:.7rem;color:#777;margin-top:2px;font-weight:700}

/* Section header */
.sec-h{font-size:.63rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#666;margin:14px 0 9px;padding-left:1px}

/* Agent grid */
.ag-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ag-card{background:#383838;border-radius:16px;padding:14px;cursor:pointer;border:2px solid transparent;transition:.15s}
.ag-card:hover,.ag-card:active{border-color:#f07d26}
.ag-name{font-weight:900;font-size:.88rem;margin-bottom:2px}
.ag-code{font-size:.67rem;color:#666;margin-bottom:7px}
.prog-wrap{background:#444;border-radius:99px;height:7px;overflow:hidden;margin:6px 0 4px}
.prog-bar{height:100%;border-radius:99px}

/* Band chip */
.band{font-size:.64rem;font-weight:800;border-radius:8px;padding:3px 8px;display:inline-block}

/* Agent detail header */
.ag-hdr-box{background:#383838;border-radius:18px;padding:15px;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.ag-av{width:46px;height:46px;border-radius:13px;background:#f07d26;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:900;color:#fff;flex-shrink:0}
.back-btn{display:flex;align-items:center;gap:6px;background:#3d3d3d;border:none;border-radius:12px;padding:9px 15px;color:#f07d26;font-size:.82rem;font-weight:800;cursor:pointer;margin-bottom:12px}

/* Tabs */
.tab-row{display:flex;gap:4px;background:#333;border-radius:14px;padding:4px;margin-bottom:13px}
.tab-btn{flex:1;border:none;background:transparent;border-radius:11px;padding:9px 0;font-size:.8rem;font-weight:800;cursor:pointer;color:#666;transition:.12s}
.tab-btn.on{background:#f07d26;color:#fff}

/* KPI rows */
.kpi-row{display:flex;justify-content:space-between;align-items:center;font-size:.77rem;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);color:#ccc}
.kpi-row:last-child{border-bottom:none}
.kpi-pts{font-weight:900;font-size:.85rem}
.kpi-sub{padding-left:10px;color:#555;font-size:.71rem}

/* Progress bar */
.pct-row{display:flex;justify-content:space-between;font-size:.71rem;color:#777;font-weight:700;margin-bottom:8px}

/* Manual payment items */
.mp-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:12px;background:#3d3d3d;margin-bottom:6px}
.mp-info{flex:1;min-width:0}
.mp-nm{font-weight:700;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-mt{font-size:.66rem;color:#666;margin-top:1px}
.mp-badge{font-size:.62rem;font-weight:800;border-radius:7px;padding:2px 7px;flex-shrink:0}
.mp-amt{font-size:.73rem;font-weight:800;color:#bbb;flex-shrink:0;text-align:right}

/* Shortfall chip */
.sf-chip{display:inline-block;padding:6px 13px;border-radius:12px;font-size:.79rem;font-weight:800;margin-top:8px}

/* Big number */
.big-num{font-size:2.2rem;font-weight:900;letter-spacing:-.04em;line-height:1}
.big-sub{font-size:.72rem;color:#777;font-weight:700;margin-top:2px}

/* Metric box */
.mbox{background:#3d3d3d;border-radius:12px;padding:12px 14px}
.mbox-lbl{font-size:.63rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#777;margin-bottom:4px}
.mbox-val{font-size:1.55rem;font-weight:900;letter-spacing:-.03em}

/* Chips row */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:13px}
.chip{background:#3d3d3d;border-radius:10px;padding:5px 10px;font-size:.7rem;font-weight:700;color:#777}
.chip span{font-weight:900;color:#f0f0f0}

/* Audit table */
.audit-wrap{overflow-x:auto;border-radius:12px;border:1px solid rgba(255,255,255,.07)}
table.audit{width:100%;border-collapse:collapse;font-size:.73rem}
table.audit th{padding:9px 9px;text-align:left;font-size:.61rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#666;border-bottom:1px solid rgba(255,255,255,.07);white-space:nowrap;background:#2e2e2e}
table.audit td{padding:8px 9px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
table.audit tr:last-child td{border-bottom:none}
.cls-chip{font-size:.62rem;font-weight:800;border-radius:6px;padding:2px 6px;white-space:nowrap}
.pool-chip{font-size:.58rem;font-weight:800;border-radius:5px;padding:1px 5px;white-space:nowrap}

/* Footer */
.footer{background:#f07d26;text-align:center;padding:16px;margin-top:20px;font-size:.7rem;color:#fff;font-weight:700;letter-spacing:.02em}

.empty-msg{text-align:center;padding:22px;color:#555;font-size:.84rem}
.loading{text-align:center;padding:40px;color:#555}
</style>
</head>
<body>

<!-- PIN -->
<div id="pinOverlay">
  <div class="pin-box">
    <img src="assets/tslalogo.png" class="pin-logo-img" alt="TSLA">
    <div class="pin-title">Two1two</div>
    <div class="pin-sub">Agent Dashboard — Masukkan PIN</div>
    <input id="pinInput" class="pin-input" type="tel" maxlength="4" placeholder="••••"
      oninput="if(this.value.length===4)submitPin()" autocomplete="off">
    <div id="pinErr" class="pin-err"></div>
    <button class="pin-btn" onclick="submitPin()">Masuk</button>
  </div>
</div>

<!-- App -->
<div id="app">
  <div class="top-bar">
    <img src="assets/tslalogo.png" class="top-logo" alt="TSLA">
    <span class="top-brand">Two1two</span>
    <select id="monthSel" class="month-sel" onchange="onMonthChange()"></select>
  </div>
  <div class="sub-bar">
    <div class="pu-wrap">
      <button id="puP" class="pu-btn on" onclick="setPU('P')">P</button>
      <button id="puU" class="pu-btn" onclick="setPU('U')">U</button>
    </div>
    <div id="updLbl" class="upd-lbl"></div>
  </div>

  <div class="container">
    <div class="content">

      <!-- Home view -->
      <div id="viewHome">
        <div id="homeContent"><div class="loading">Memuatkan…</div></div>
      </div>

      <!-- Agent detail -->
      <div id="viewDash" style="display:none">
        <button class="back-btn" onclick="showHome()">← Senarai Agen</button>
        <div class="ag-hdr-box">
          <div id="dashAv" class="ag-av"></div>
          <div style="flex:1;min-width:0">
            <div id="dashName" style="font-weight:900;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
            <div id="dashCode" style="font-size:.7rem;color:#666;margin-top:2px"></div>
          </div>
          <div id="dashBand" class="band"></div>
        </div>

        <div class="tab-row">
          <button id="tabOv" class="tab-btn on" onclick="switchTab('ov')">📊 Overview</button>
          <button id="tabPr" class="tab-btn" onclick="switchTab('pr')">📋 PR13 &amp; CE</button>
        </div>

        <div id="paneOv">
          <div id="mtdCard"></div>
          <div id="bscCard"></div>
          <div id="mpCard"></div>
        </div>
        <div id="panePr" style="display:none">
          <div id="prContent"></div>
        </div>
      </div>

    </div>
    <div class="footer">© Two1two · TSLA Group · Powered by Data</div>
  </div>
</div>

<script>
/* ── PIN ─────────────────────────────── */
const PIN = '1111';
function submitPin() {
  const v = document.getElementById('pinInput').value;
  if (v === PIN) {
    sessionStorage.setItem('212_ok','1');
    document.getElementById('pinOverlay').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initApp();
  } else {
    document.getElementById('pinErr').textContent = 'PIN salah. Cuba lagi.';
    document.getElementById('pinInput').value = '';
  }
}

/* ── Config ──────────────────────────── */
const GROUPS = {
  'A11668': ['A11668','A13290','A14252','A12322'],
};
const MTD_TARGET = 10000;
const X13 = new Set(['FWD Life First','FWD Protect First','FWD Income First']);
const FX12 = new Set(['AN443318','AN457372']);

/* ── State ───────────────────────────── */
let DATA = null, CUR = null, PU = 'P', VY, VM;

/* ── Date init ───────────────────────── */
function initDate() {
  const t = new Date();
  VY = t.getFullYear(); VM = t.getMonth();
}
function vKey() { return VY * 12 + VM; }
function vLabel() {
  return new Date(VY, VM, 1).toLocaleString('en-MY',{month:'short',year:'numeric'});
}
function buildMonths() {
  const sel = document.getElementById('monthSel');
  const t = new Date(); t.setDate(1);
  for (let i = 0; i < 12; i++) {
    const y = t.getFullYear(), m = t.getMonth();
    const o = document.createElement('option');
    o.value = `${y}-${m}`;
    o.textContent = new Date(y,m,1).toLocaleString('en-MY',{month:'short',year:'numeric'});
    if (y===VY && m===VM) o.selected = true;
    sel.appendChild(o);
    t.setMonth(t.getMonth()-1);
  }
}
function onMonthChange() {
  const [y,m] = document.getElementById('monthSel').value.split('-').map(Number);
  VY=y; VM=m; refresh();
}
function setUpdLbl() {
  const t=new Date();
  const d=String(t.getDate()).padStart(2,'0'),mo=String(t.getMonth()+1).padStart(2,'0');
  document.getElementById('updLbl').textContent=`last updated ${d}/${mo}/${t.getFullYear()}`;
}

/* ── P/U ─────────────────────────────── */
function setPU(v) {
  PU=v;
  document.getElementById('puP').classList.toggle('on',v==='P');
  document.getElementById('puU').classList.toggle('on',v==='U');
  refresh();
}
function refresh() { CUR ? renderDash(CUR) : renderHome(); }

/* ── Clients for agent ───────────────── */
function agClients(code) {
  if (!DATA) return [];
  if (PU==='U' && GROUPS[code]) {
    const s = new Set(GROUPS[code]);
    return DATA.agents.filter(a=>s.has(a.code)).flatMap(a=>a.clients||[]);
  }
  const a = DATA.agents.find(a=>a.code===code);
  return a ? (a.clients||[]) : [];
}

/* ── ACE helpers ─────────────────────── */
function ace(c) {
  const cert=(c.certNo||'').replace(/^FWD\//,'');
  if (!FX12.has(cert) && X13.has(c.plan)) {
    const d=new Date(c.issueDate||'');
    if (!isNaN(d)&&d>=new Date('2024-07-01')&&d<=new Date('2024-11-30')&&c.contribution>=200)
      return Math.round(c.contribution*13*100)/100;
  }
  return c.ace||Math.round(c.contribution*12*100)/100;
}
function moPaid(c) {
  if (!c.issueDate||!c.statusUpdatedDate) return 0;
  const a=new Date(c.issueDate),b=new Date(c.statusUpdatedDate);
  return (b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
}
function projLast() { return new Date(VY,VM+1,0); }
function pitStatus(c) {
  if (!c.statusUpdatedDate) return c.status;
  const u=new Date(c.statusUpdatedDate);
  if (c.status==='Contract Surrendered'&&u>projLast()) return 'In Force';
  if (c.status==='Lapsed') {
    const uk=u.getFullYear()*12+u.getMonth();
    if (uk>vKey()&&moPaid(c)>=13) return 'In Force';
  }
  return c.status;
}

/* ── Classification ──────────────────── */
function clsPR13(c) {
  if (!c.issueDate) return {cls:'na'};
  const ik=new Date(c.issueDate).getFullYear()*12+new Date(c.issueDate).getMonth();
  const b=vKey(),ws=b-24,we=b-12;
  if (ik<ws||ik>=we) return {cls:'na'};
  if (c.status==='Freelook Cancellation') return {cls:'excl',reason:'Freelook'};
  const eff=pitStatus(c);
  if (eff==='In Force') return {cls:'100',reason:'In Force'};
  if (eff==='Contract Surrendered') return moPaid(c)>=13?{cls:'100',reason:'CS≥13mo'}:{cls:'0',reason:'CS<13mo'};
  return {cls:'0',reason:eff||'Lapsed'};
}
function clsCE(c) {
  if (!c.issueDate) return {cls:'na'};
  const ik=new Date(c.issueDate).getFullYear()*12+new Date(c.issueDate).getMonth();
  const vk=vKey(),ceM=vk-12;
  if (ik<ceM||ik>=vk) return {cls:'na'};
  if (c.status==='Freelook Cancellation') return {cls:'excl',reason:'Freelook'};
  if (c.dueDate) {
    const dk=new Date(c.dueDate).getFullYear()*12+new Date(c.dueDate).getMonth();
    if (dk===vk) return {cls:'100',reason:'Due this month',watch:true};
    if (dk<vk)  return {cls:'0',reason:'Due passed'};
  }
  if (c.status==='Contract Surrendered') return {cls:'0',reason:'CS'};
  if (c.payMethod==='Biro Angkasa')      return {cls:'100',reason:'BA'};
  return c.status==='In Force'?{cls:'100',reason:'In Force'}:{cls:'0',reason:c.status};
}
function clsPR25(c) {
  if (!c.issueDate) return {cls:'na'};
  const ik=new Date(c.issueDate).getFullYear()*12+new Date(c.issueDate).getMonth();
  const vk=vKey(),ws=vk-36,we=vk-24;
  if (ik<ws||ik>=we) return {cls:'na'};
  if (c.status==='Freelook Cancellation') return {cls:'excl',reason:'Freelook'};
  const eff=pitStatus(c);
  if (eff==='In Force') return {cls:'100',reason:'In Force'};
  if (eff==='Contract Surrendered') return moPaid(c)>=25?{cls:'100',reason:'CS≥25mo'}:{cls:'0',reason:'CS<25mo'};
  return {cls:'0',reason:'Lapsed'};
}

function calcM(clients,fn) {
  let eACE=0,cACE=0,zACE=0,xACE=0,eCnt=0; const rows=[];
  for (const c of clients) {
    const a=ace(c),r=fn(c);
    rows.push({...c,_cls:r.cls,_reason:r.reason||'',_ace:a,_watch:r.watch||false});
    if (r.cls==='na') continue;
    if (r.cls==='excl'){xACE+=a;continue;}
    eACE+=a;eCnt++;
    if (r.cls==='100') cACE+=a; else zACE+=a;
  }
  const rate=eACE>0?Math.round(cACE/eACE*10000)/100:null;
  return {rate,eACE,cACE,zACE,xACE,eCnt,rows};
}

/* ── BSC ─────────────────────────────── */
function k2aPts(v){return v>=95?150:v>=92.5?125:v>=90?100:v>=85?75:0}
function k2bPts(v){return v>=90?150:v>=85?125:v>=80?100:v>=75?75:0}
function band(s) {
  if (s>=100) return {lbl:'✨ Overperformer',color:'#27ae60',bg:'rgba(39,174,96,.15)'};
  if (s>=85)  return {lbl:'📊 Near Target',  color:'#f0a500',bg:'rgba(240,165,0,.15)'};
  return            {lbl:'⚠️ Below Standard',color:'#e53935',bg:'rgba(229,57,53,.15)'};
}
function ptsC(p){return p>=125?'#27ae60':p>=75?'#f0a500':'#e53935'}

/* ── Format ──────────────────────────── */
const RM=v=>'RM '+v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const RA=v=>'RM '+v.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const SN=n=>{const p=(n||'').split(' ');return p.length<=2?n:p.slice(0,2).join(' ')};
const INI=n=>(n||'').split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
const rateC=r=>r>=95?'#27ae60':r>=85?'#f0a500':'#e53935';
const rateCC=r=>r>=90?'#27ae60':r>=70?'#f0a500':'#e53935';

/* ── MTD / YTD helpers ───────────────── */
function mtdClients(clients) {
  return clients.filter(c=>{
    if (!c.issueDate) return false;
    const d=new Date(c.issueDate);
    return d.getFullYear()===VY&&d.getMonth()===VM;
  });
}
function ytdClients(clients) {
  return clients.filter(c=>{
    if (!c.issueDate) return false;
    const d=new Date(c.issueDate);
    return d.getFullYear()===VY&&d.getMonth()<=VM;
  });
}

/* ── Init ────────────────────────────── */
function initApp() {
  initDate();
  buildMonths();
  setUpdLbl();
  fetch('data/pr-data.json')
    .then(r=>{if(!r.ok)throw Error(r.status);return r.json()})
    .then(d=>{DATA=d;renderHome()})
    .catch(()=>{
      document.getElementById('homeContent').innerHTML='<div class="empty-msg">Gagal memuatkan data.</div>';
    });
}

/* boot */
if (sessionStorage.getItem('212_ok')==='1') {
  document.getElementById('pinOverlay').style.display='none';
  document.getElementById('app').style.display='block';
  initApp();
}

/* ── Navigation ──────────────────────── */
function showHome() {
  CUR=null;
  document.getElementById('viewHome').style.display='';
  document.getElementById('viewDash').style.display='none';
  renderHome();
}
function showDash(code) {
  CUR=code;
  document.getElementById('viewHome').style.display='none';
  document.getElementById('viewDash').style.display='';
  renderDash(code);
}
function switchTab(t) {
  const isOv=t==='ov';
  document.getElementById('paneOv').style.display=isOv?'':'none';
  document.getElementById('panePr').style.display=isOv?'none':'';
  document.getElementById('tabOv').classList.toggle('on',isOv);
  document.getElementById('tabPr').classList.toggle('on',!isOv);
}

/* ── Home ────────────────────────────── */
function renderHome() {
  if (!DATA) return;
  const all = DATA.agents.flatMap(a=>a.clients||[]);

  const mtdAll = mtdClients(all);
  const ytdAll = ytdClients(all);
  const mtdACE = mtdAll.reduce((s,c)=>s+ace(c),0);
  const ytdACE = ytdAll.reduce((s,c)=>s+ace(c),0);

  const r13 = calcM(all, clsPR13);
  const rCE = calcM(all, clsCE);
  const pr13R = r13.rate, ceR = rCE.rate;

  const agCards = DATA.agents.map(ag=>{
    const cl = ag.clients||[];
    const m = mtdClients(cl).reduce((s,c)=>s+ace(c),0);
    const pct = Math.min(100, m/MTD_TARGET*100);
    const bc = pct>=100?'#27ae60':pct>=60?'#f0a500':'#e53935';
    const ra = calcM(cl,clsPR13), rb = calcM(cl,clsPR25);
    const ka=ra.rate!==null?k2aPts(ra.rate):0, kb=rb.rate!==null?k2bPts(rb.rate):0;
    const hasBsc=ra.rate!==null||rb.rate!==null;
    const bsc=hasBsc?55+ka*0.25+kb*0.30:null;
    const bd=bsc!==null?band(bsc):null;
    return `<div class="ag-card" onclick="showDash('${ag.code}')">
      <div class="ag-name">${SN(ag.name)}</div>
      <div class="ag-code">${ag.code}</div>
      <div class="prog-wrap"><div class="prog-bar" style="width:${pct.toFixed(0)}%;background:${bc}"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:.65rem;color:#666;margin-bottom:6px">
        <span>${RA(m)}</span><span>${pct.toFixed(0)}%</span>
      </div>
      ${bd?`<div class="band" style="color:${bd.color};background:${bd.bg}">${bd.lbl} ${bsc.toFixed(1)}%</div>`
          :`<div class="band" style="color:#555;background:#333">—</div>`}
    </div>`;
  }).join('');

  document.getElementById('homeContent').innerHTML = `
    <div class="g2">
      <div class="card">
        <div class="card-hdr hdr-orange">ACE / FYC</div>
        <div class="card-body">
          <div class="st-lbl">MTD — ${vLabel()}</div>
          <div class="st-val">${RA(mtdACE)}</div>
          <div class="st-lbl" style="margin-top:10px">YTD ${VY}</div>
          <div class="st-val" style="font-size:1.1rem;color:#bbb">${RA(ytdACE)}</div>
        </div>
      </div>
      <div class="card">
        <div class="card-hdr hdr-purple">Kes Baharu</div>
        <div class="card-body">
          <div class="st-lbl">MTD — ${vLabel()}</div>
          <div class="st-val">${mtdAll.length}</div>
          <div class="st-lbl" style="margin-top:10px">YTD ${VY}</div>
          <div class="st-val" style="font-size:1.1rem;color:#bbb">${ytdAll.length}</div>
        </div>
      </div>
    </div>
    <div class="g2">
      <div class="card">
        <div class="card-hdr hdr-teal">CE (1st Year)</div>
        <div class="card-body" style="text-align:center">
          <div style="font-size:2.4rem;font-weight:900;letter-spacing:-.03em;color:${ceR!==null?rateCC(ceR):'#555'}">
            ${ceR!==null?ceR.toFixed(2)+'%':'—'}
          </div>
          <div style="font-size:.69rem;color:#666;margin-top:4px">${rCE.eCnt} klien eligible</div>
        </div>
      </div>
      <div class="card">
        <div class="card-hdr hdr-violet">PR13 (13th Month)</div>
        <div class="card-body" style="text-align:center">
          <div style="font-size:2.4rem;font-weight:900;letter-spacing:-.03em;color:${pr13R!==null?rateC(pr13R):'#555'}">
            ${pr13R!==null?pr13R.toFixed(2)+'%':'—'}
          </div>
          <div style="font-size:.69rem;color:#666;margin-top:4px">${r13.eCnt} klien eligible</div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-hdr hdr-slate">Manpower</div>
      <div class="card-body" style="display:flex;gap:24px">
        <div><div class="st-lbl">Agen</div><div class="st-val">${DATA.agents.length}</div></div>
        <div><div class="st-lbl">Klien</div><div class="st-val">${all.length}</div></div>
      </div>
    </div>
    <div class="sec-h">Prestasi Agen — ${vLabel()}</div>
    <div class="ag-grid">${agCards}</div>`;
}

/* ── Agent Dashboard ─────────────────── */
function renderDash(code) {
  const ag = DATA.agents.find(a=>a.code===code);
  if (!ag) return;
  const clients = agClients(code);
  const isUnit = PU==='U'&&GROUPS[code]&&GROUPS[code].length>1;

  const r13=calcM(clients,clsPR13), rCE=calcM(clients,clsCE), r25=calcM(clients,clsPR25);
  const ka=r13.rate!==null?k2aPts(r13.rate):0, kb=r25.rate!==null?k2bPts(r25.rate):0;
  const hasBsc=r13.rate!==null||r25.rate!==null;
  const bsc=hasBsc?55+ka*0.25+kb*0.30:null;
  const bd=bsc!==null?band(bsc):null;

  document.getElementById('dashAv').textContent=INI(ag.name);
  document.getElementById('dashName').textContent=SN(ag.name)+(isUnit?' (Unit)':'');
  document.getElementById('dashCode').textContent=ag.code+' — '+vLabel();
  const bc=document.getElementById('dashBand');
  if (bd){bc.textContent=bd.lbl+' '+bsc.toFixed(1)+'%';bc.style.color=bd.color;bc.style.background=bd.bg;}
  else {bc.textContent='No data';bc.style.color='#666';bc.style.background='#3d3d3d';}

  renderMTD(clients);
  renderBSC(r13,r25,ka,kb,bsc,bd);
  renderMP(clients);
  renderPR(r13,rCE,r25);
  switchTab('ov');
}

/* ── MTD Card ────────────────────────── */
function renderMTD(clients) {
  const mtdC=mtdClients(clients);
  const mtd=mtdC.reduce((s,c)=>s+ace(c),0);
  const ytd=ytdClients(clients).reduce((s,c)=>s+ace(c),0);
  const pct=Math.min(100,mtd/MTD_TARGET*100);
  const sf=MTD_TARGET-mtd;
  const bc=pct>=100?'#27ae60':pct>=60?'#f0a500':'#e53935';

  const rows=mtdC.slice(0,5).map(c=>`
    <div class="mp-item">
      <div class="mp-info">
        <div class="mp-nm">${c.name||'—'}</div>
        <div class="mp-mt">${(c.certNo||'').replace(/^FWD\//,'')} · ${c.plan||''}</div>
      </div>
      <div class="mp-amt">${RM(ace(c))}</div>
    </div>`).join('');

  document.getElementById('mtdCard').innerHTML=`
    <div class="card">
      <div class="card-hdr hdr-orange">📈 Pengeluaran MTD — ${vLabel()}</div>
      <div class="card-body">
        <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px">
          <div>
            <div class="st-lbl">MTD ACE</div>
            <div class="big-num" style="color:${bc}">${RA(mtd)}</div>
            <div class="st-sub">Target: ${RA(MTD_TARGET)}</div>
          </div>
          <div style="text-align:right">
            <div class="st-lbl">YTD ${VY}</div>
            <div style="font-size:1.2rem;font-weight:900;color:#bbb">${RA(ytd)}</div>
            <div class="st-sub">${mtdC.length} kes</div>
          </div>
        </div>
        <div class="prog-wrap"><div class="prog-bar" style="width:${pct.toFixed(1)}%;background:${bc}"></div></div>
        <div class="pct-row"><span>${pct.toFixed(1)}% daripada target</span><span>${RA(MTD_TARGET)}</span></div>
        ${sf>0
          ?`<div class="sf-chip" style="background:rgba(229,57,53,.12);color:#e53935">Shortfall: <strong>${RA(sf)}</strong></div>`
          :`<div class="sf-chip" style="background:rgba(39,174,96,.12);color:#27ae60">🎉 Target dicapai! Lebihan: <strong>${RA(-sf)}</strong></div>`}
        ${mtdC.length>0?`<div class="sec-h">Kes baharu bulan ini</div>${rows}${mtdC.length>5?`<div style="font-size:.7rem;color:#555;text-align:center;margin-top:4px">+${mtdC.length-5} lagi</div>`:''}`:''}
      </div>
    </div>`;
}

/* ── BSC Card ────────────────────────── */
function renderBSC(r13,r25,ka,kb,bsc,bd) {
  if (bsc===null) {
    document.getElementById('bscCard').innerHTML=`
      <div class="card"><div class="card-hdr hdr-dark">🏆 BSC Performance</div>
      <div class="card-body"><div class="empty-msg">Tiada data untuk pengiraan BSC.</div></div></div>`;
    return;
  }
  document.getElementById('bscCard').innerHTML=`
    <div class="card">
      <div class="card-hdr" style="background:${bd.color}">🏆 BSC Performance — ${vLabel()}</div>
      <div class="card-body">
        <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
          <div>
            <div class="big-num" style="color:${bd.color}">${bsc.toFixed(2)}%</div>
            <div class="big-sub">${vLabel()}</div>
          </div>
          <div class="band" style="color:${bd.color};background:${bd.bg};font-size:.76rem;padding:6px 12px">${bd.lbl}</div>
        </div>
        <div class="kpi-row">
          <span style="color:#888">KPI 1 — CFF (150 pts × 20%)</span>
          <span class="kpi-pts" style="color:#27ae60">+30.00</span>
        </div>
        <div class="kpi-row">
          <span>KPI 2a — PR13 (${ka} pts × 25%)</span>
          <span class="kpi-pts" style="color:${ptsC(ka)}">+${(ka*0.25).toFixed(2)}</span>
        </div>
        <div class="kpi-row kpi-sub">
          <span style="color:#555">${r13.rate!==null?`${r13.rate.toFixed(2)}% · ${r13.eCnt} klien`:'Tiada klien dalam window'}</span>
        </div>
        <div class="kpi-row">
          <span>KPI 2b — 2nd Year (${kb} pts × 30%)</span>
          <span class="kpi-pts" style="color:${ptsC(kb)}">+${(kb*0.30).toFixed(2)}</span>
        </div>
        <div class="kpi-row kpi-sub">
          <span style="color:#555">${r25.rate!==null?`${r25.rate.toFixed(2)}% · ${r25.eCnt} klien`:'Tiada kohort 2nd year (0 pts)'}</span>
        </div>
        <div class="kpi-row">
          <span style="color:#888">KPI 3 — Complaints (100 pts × 10%)</span>
          <span class="kpi-pts" style="color:#27ae60">+10.00</span>
        </div>
        <div class="kpi-row" style="font-weight:900;border-top:2px solid rgba(255,255,255,.08);padding-top:8px;margin-top:4px">
          <span style="color:#f0f0f0">BSC Score</span>
          <span style="color:${bd.color};font-size:1rem">${bsc.toFixed(2)}%</span>
        </div>
      </div>
    </div>`;
}

/* ── Manual Payment Card ─────────────── */
function renderMP(clients) {
  const vk=vKey();
  const overdue=clients.filter(c=>{
    if (!c.dueDate||c.status==='Freelook Cancellation'||(c.payMethod||'')==='Biro Angkasa') return false;
    return new Date(c.dueDate).getFullYear()*12+new Date(c.dueDate).getMonth()<=vk;
  }).map(c=>({...c,_mo:vk-(new Date(c.dueDate).getFullYear()*12+new Date(c.dueDate).getMonth())}))
    .sort((a,b)=>b._mo-a._mo);

  const baTr=clients.filter(c=>{
    if (!c.issueDate||c.status==='Freelook Cancellation'||(c.payMethod||'')!=='Biro Angkasa') return false;
    const ik=new Date(c.issueDate).getFullYear()*12+new Date(c.issueDate).getMonth();
    return ik>=vk-2&&ik<=vk;
  }).map(c=>({...c,_mo:vk-(new Date(c.issueDate).getFullYear()*12+new Date(c.issueDate).getMonth())}))
    .sort((a,b)=>b._mo-a._mo);

  let html='';
  if (!overdue.length&&!baTr.length) html='<div class="empty-msg">Tiada klien perlu tindakan manual.</div>';

  if (baTr.length) {
    html+=`<div class="sec-h">🏦 BA Transisi</div>`;
    html+=baTr.map(c=>{
      const lbl=c._mo===0?'Bulan ini':c._mo===1?'Bulan kedua':'Bulan ketiga';
      return `<div class="mp-item">
        <div class="mp-info"><div class="mp-nm">${c.name||'—'}</div><div class="mp-mt">${c.certNo||''} · ${lbl}</div></div>
        <div class="mp-amt">${RM(c.contribution)}/bln</div>
        <div class="mp-badge" style="color:#64b5f6;background:rgba(100,181,246,.15)">BA</div>
      </div>`;
    }).join('');
  }
  if (overdue.length) {
    html+=`<div class="sec-h">💸 Perlu bayaran manual — ${overdue.length} klien</div>`;
    html+=overdue.map(c=>{
      const col=c._mo===0?'#f0a500':'#e53935';
      const lbl=c._mo===0?'Bulan ini':`${c._mo} bln lalu`;
      return `<div class="mp-item">
        <div class="mp-info">
          <div class="mp-nm">${c.name||'—'}</div>
          <div class="mp-mt">${(c.certNo||'').replace(/^FWD\//,'')} · ${c.payMethod||'—'}</div>
        </div>
        <div class="mp-amt">${RM(c.contribution)}</div>
        <div class="mp-badge" style="color:${col};background:rgba(229,57,53,.15)">${lbl}</div>
      </div>`;
    }).join('');
  }

  document.getElementById('mpCard').innerHTML=`
    <div class="card">
      <div class="card-hdr hdr-red">💸 Manual Payment</div>
      <div class="card-body">${html}</div>
    </div>`;
}

/* ── PR13 & CE Tab ───────────────────── */
function renderPR(r13,rCE,r25) {
  const p13=r13.rate, ce=rCE.rate, p25=r25.rate;
  const vk=vKey();

  const auditRows=[
    ...r13.rows.filter(c=>c._cls!=='na').map(c=>({...c,_pool:'PR13'})),
    ...rCE.rows.filter(c=>c._cls!=='na').map(c=>({...c,_pool:'CE'})),
  ].sort((a,b)=>({'100':0,'0':1,excl:2}[a._cls]??1)-({'100':0,'0':1,excl:2}[b._cls]??1));

  const clsH=(cls,watch)=>{
    if (watch) return`<span class="cls-chip" style="color:#f0a500;background:rgba(240,165,0,.15)">⚠️ Watch</span>`;
    if (cls==='100') return`<span class="cls-chip" style="color:#27ae60;background:rgba(39,174,96,.15)">✓ 100%</span>`;
    if (cls==='0')   return`<span class="cls-chip" style="color:#e53935;background:rgba(229,57,53,.15)">✗ 0%</span>`;
    return`<span class="cls-chip" style="color:#666;background:#3d3d3d">Excl</span>`;
  };
  const poolH=p=>p==='PR13'
    ?`<span class="pool-chip" style="color:#ce93d8;background:rgba(206,147,216,.15)">PR13</span>`
    :`<span class="pool-chip" style="color:#90caf9;background:rgba(144,202,249,.15)">CE</span>`;

  document.getElementById('prContent').innerHTML=`
    <div class="g2" style="margin-bottom:12px">
      <div class="mbox">
        <div class="mbox-lbl" style="color:#ce93d8">PR13 (KPI 2a)</div>
        <div class="mbox-val" style="color:${p13!==null?rateC(p13):'#555'}">${p13!==null?p13.toFixed(2)+'%':'—'}</div>
        <div style="font-size:.69rem;color:#555;margin-top:4px">${r13.eCnt} klien eligible</div>
      </div>
      <div class="mbox">
        <div class="mbox-lbl" style="color:#90caf9">CE (1st Year)</div>
        <div class="mbox-val" style="color:${ce!==null?rateCC(ce):'#555'}">${ce!==null?ce.toFixed(2)+'%':'—'}</div>
        <div style="font-size:.69rem;color:#555;margin-top:4px">${rCE.eCnt} klien eligible</div>
      </div>
    </div>

    <div class="card" style="margin-bottom:12px">
      <div class="card-hdr hdr-slate">KPI 2b — 2nd Year Persistency</div>
      <div class="card-body">
        <div style="display:flex;align-items:center;gap:16px">
          <div class="big-num" style="color:${p25!==null?rateC(p25):'#555'}">${p25!==null?p25.toFixed(2)+'%':'—'}</div>
          <div>
            <div style="font-size:.74rem;color:#777">${r25.eCnt} klien · ${RA(r25.eACE)} ACE</div>
            <div style="font-size:.7rem;color:#555;margin-top:2px">Cohort: ${new Date(VY,VM-36,1).toLocaleString('en-MY',{month:'short',year:'numeric'})} – ${new Date(VY,VM-24,1).toLocaleString('en-MY',{month:'short',year:'numeric'})}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="chips">
      <div class="chip">Elig ACE <span>${RA(r13.eACE)}</span></div>
      <div class="chip">Coll <span>${RA(r13.cACE)}</span></div>
      <div class="chip">0% <span>${RA(r13.zACE)}</span></div>
      <div class="chip">Excl <span>${RA(r13.xACE)}</span></div>
    </div>

    <div class="sec-h">Audit — PR13 &amp; CE (${auditRows.length} klien)</div>
    <div class="audit-wrap">
      <table class="audit">
        <thead><tr>
          <th>Klien</th><th>Pool</th><th>Due Date</th><th>Method</th>
          <th style="text-align:right">ACE</th><th>Status</th>
        </tr></thead>
        <tbody>
        ${auditRows.length===0?'<tr><td colspan="6" style="text-align:center;color:#444;padding:20px">Tiada data</td></tr>':
          auditRows.map(c=>{
            const dk=c.dueDate?new Date(c.dueDate).getFullYear()*12+new Date(c.dueDate).getMonth():null;
            const dc=dk===null?'#555':dk===vk?'#f0a500':dk<vk?'#e53935':'#27ae60';
            return`<tr>
              <td>
                <div style="font-weight:700;font-size:.77rem;color:#f0f0f0">${SN(c.name||'—')}</div>
                <div style="font-size:.62rem;color:#555">${(c.certNo||'').replace(/^FWD\//,'')}</div>
              </td>
              <td>${poolH(c._pool)}</td>
              <td style="color:${dc};font-weight:700;font-size:.71rem">${c.dueDate||'—'}</td>
              <td style="font-size:.68rem;color:#666">${(c.payMethod||'—').replace('Biro Angkasa','BA')}</td>
              <td style="text-align:right;font-weight:800;font-size:.71rem;color:#bbb">${RA(c._ace)}</td>
              <td>${clsH(c._cls,c._watch)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
}
</script>
</body>
</html>
